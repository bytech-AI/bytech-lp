<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ベル様 ご提案書｜AI推進担当マンツーマン研修｜全12スライド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ベル様向け個別提案書（A案：社長向け1枚＋詳細）。設計は ebook-04/13 と同系統
     （四角の角丸なし・円とピルのみ角丸）。
     ★お客様固有の提案書。/proposals/<slug> の閲覧ページのみで配信し、DLフォーム・PDF・
       お役立ち資料一覧・サイトマップには載せない。noindex。
     ★金額・人数・日付はすべて面談内容にもとづく。変更は本ファイルを直して
       `node scripts/build-ebook.mjs proposal-bell-2610` を実行する。 */
  :root {
    --blue: #2c5c9c; --blue-deep: #1a2e50; --blue-bright: #1a6fb5; --blue-pale: #8fb0d8;
    --ink: #2a2f3a; --line: #e3e8ef; --amber: #f0b429; --tint: #eef4fb; --red: #c9463d; --red-tint: #fbf0ef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4f6f8; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; color: var(--ink); padding: 48px 0 96px; }
  .note { max-width: 1120px; margin: 0 auto 28px; font-size: 13px; font-weight: 700; color: #8a93a3; }
  .en { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; }

  .deck { display: flex; flex-direction: column; gap: 34px; align-items: center; counter-reset: pg -1; }
  .slide-shell { width: 1120px; counter-increment: pg; }
  .slide-shell figcaption { font-size: 12px; font-weight: 700; color: #8a93a3; margin: 8px 2px 0; letter-spacing: .04em; }
  .slide { width: 1280px; height: 720px; transform: scale(0.875); transform-origin: top left; background: #fff; position: relative; overflow: hidden; }
  .slide-shell .clip { height: 630px; overflow: hidden; border-radius: 0; box-shadow: 0 2px 10px rgba(26,35,48,.08); }

  /* ===== 共通 ===== */
  .s-body { position: absolute; inset: 0; padding: 36px 56px; z-index: 1; }
  .s-eyebrow { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; color: var(--blue-pale); letter-spacing: .02em; }
  .s-eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
  .s-logo { position: absolute; top: 38px; right: 56px; height: 30px; }
  .s-title { font-size: 28px; font-weight: 800; color: #1a2330; line-height: 1.4; letter-spacing: .01em; margin-top: 10px; }
  .s-title b { color: var(--blue-bright); }
  .s-lead { font-size: 14px; font-weight: 600; color: #4a5568; line-height: 1.7; margin-top: 8px; }
  .s-foot { position: absolute; left: 56px; right: 120px; bottom: 14px; font-size: 10px; color: #9aa3b2; line-height: 1.6; z-index: 5; }
  .s-num { position: absolute; right: 0; bottom: 0; width: 66px; height: 66px; background: var(--blue); border-radius: 66px 0 0 0; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 14px 10px 0; z-index: 5; }
  .s-num::before { content: counter(pg); }

  /* 汎用パーツ */
  .sec { border: 1px solid var(--line); background: #fff; }
  .sec .h { background: #f2f5fa; border-bottom: 1px solid var(--line); font-size: 13.5px; font-weight: 800; color: var(--blue-deep); padding: 9px 16px; display: flex; align-items: center; gap: 8px; }
  .sec .h::before { content: ""; width: 5px; height: 15px; background: var(--blue); }
  .sec .b { padding: 10px 16px 12px; }
  .sec .i { position: relative; font-size: 13.2px; font-weight: 500; color: #4a5568; line-height: 1.7; padding: 4px 0 4px 15px; }
  .sec .i::before { content: ""; position: absolute; left: 0; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue-pale); }
  .sec .i b { color: #1a2330; font-weight: 800; }
  .sec.warn .h::before { background: var(--red); }
  .sec.warn .i::before { background: #e6a09a; }
  .band { display: flex; align-items: center; gap: 12px; background: var(--tint); border: 1.5px solid var(--blue); padding: 14px 22px; font-size: 14.5px; font-weight: 800; color: var(--blue-deep); margin-top: 16px; line-height: 1.6; }
  .band > span { flex: 1; }
  .band::before { content: "✓"; flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .band b { color: var(--blue-bright); }
  .tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; color: var(--blue); background: var(--tint); border: 1px solid #d5e3f4; padding: 3px 9px; white-space: nowrap; }

  /* ===== 表紙 ===== */
  .cv { background: #fff; }
  .cv .eyebrow { position: absolute; left: 72px; top: 92px; display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; color: var(--blue); letter-spacing: .12em; }
  .cv .eyebrow::before { content: ""; width: 28px; height: 3px; background: var(--blue); }
  .cv .to { position: absolute; left: 72px; top: 132px; font-size: 26px; font-weight: 800; color: #1a2330; letter-spacing: .04em; }
  .cv .to small { font-size: 15px; font-weight: 700; color: #6b7789; margin-left: 10px; letter-spacing: .06em; }
  .cv .t { position: absolute; left: 70px; top: 214px; font-size: 58px; font-weight: 900; color: var(--blue); line-height: 1.32; letter-spacing: .02em; }
  .cv .sub { position: absolute; left: 73px; top: 392px; font-size: 20px; font-weight: 800; color: #2a2f3a; letter-spacing: .04em; line-height: 1.7; }
  .cv .meta { position: absolute; left: 73px; top: 480px; font-size: 13.5px; font-weight: 700; color: #8a93a3; letter-spacing: .06em; line-height: 1.9; }
  .cv .logo { position: absolute; left: 72px; bottom: 58px; height: 38px; }
  .cv .il { position: absolute; left: 590px; top: 386px; height: 300px; }
  .cv .panel { position: absolute; right: 0; top: 0; bottom: 0; width: 400px; background: var(--blue-deep); color: #fff; padding: 92px 48px 0; }
  .cv .panel .ph { font-size: 12.5px; font-weight: 800; letter-spacing: .14em; color: #8fd0ff; }
  .cv .panel .pi { border-top: 1px solid rgba(255,255,255,.18); padding: 22px 0 20px; }
  .cv .panel .pi:first-of-type { margin-top: 18px; }
  .cv .panel .pk { font-size: 12px; font-weight: 700; color: #b7c6dc; }
  .cv .panel .pv { font-size: 21px; font-weight: 800; line-height: 1.45; margin-top: 6px; }
  .cv .panel .pv b { color: #8fd0ff; font-size: 30px; }
  .cv .panel .pv small { font-size: 13px; font-weight: 700; color: #b7c6dc; }
  .cv .panel .conf { position: absolute; left: 48px; bottom: 60px; font-size: 11px; font-weight: 700; color: #8ea2c0; line-height: 1.7; }

  /* ===== 社長向け1枚（サマリー） ===== */
  .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-top: 14px; }
  .sum .box { border: 1px solid var(--line); padding: 11px 16px 12px; position: relative; }
  .sum .box .k { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--blue); letter-spacing: .06em; }
  .sum .box .k::before { content: ""; width: 5px; height: 13px; background: var(--blue); }
  .sum .box .v { font-size: 15.5px; font-weight: 800; color: #1a2330; line-height: 1.5; margin-top: 5px; }
  .sum .box .v b { color: var(--blue-bright); }
  .sum .box .d { font-size: 12.2px; font-weight: 500; color: #4a5568; line-height: 1.65; margin-top: 4px; }
  .sum .box .d b { color: #1a2330; font-weight: 800; }
  .sum .box.price { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
  .sum .box.price .k { color: #8fd0ff; } .sum .box.price .k::before { background: #8fd0ff; }
  .sum .box.price .v { color: #fff; font-size: 15px; margin-top: 8px; }
  .sum .box.price .v b { color: #8fd0ff; font-size: 34px; letter-spacing: .01em; }
  .sum .box.price .v small { font-size: 12.5px; font-weight: 700; color: #b7c6dc; }
  .sum .box.price .d { color: #c4d2e6; }
  .sum .box.price .d b { color: #fff; }
  .sum .lines { display: grid; gap: 4px; margin-top: 6px; }
  .sum .lines p { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; font-weight: 700; color: #1a2330; line-height: 1.6; }
  .sum .lines p span { flex: 0 0 auto; width: 20px; height: 20px; background: var(--tint); color: var(--blue); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .sum .wide { grid-column: 1 / -1; }

  /* ===== 現状と目的 ===== */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 22px; align-items: stretch; }
  .two .sec { display: flex; flex-direction: column; }
  .two .sec .b { padding: 14px 20px 18px; flex: 1; display: flex; flex-direction: column; }
  .two .kpi { margin-top: auto !important; padding-top: 14px; }
  .two .sec .i { font-size: 14.5px; line-height: 1.85; padding: 6px 0 6px 17px; }
  .two .sec .i::before { top: 16px; }
  .two .kpi div { padding: 14px 16px; }
  .two .kpi .k { font-size: 11.5px; }
  .two .kpi .v { font-size: 28px; }
  .two .kpi .n { font-size: 11.5px; margin-top: 5px; }
  .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi div { background: var(--tint); border-left: 4px solid var(--blue); padding: 11px 13px; }
  .kpi .k { font-size: 10.5px; font-weight: 800; color: var(--blue); }
  .kpi .v { font-size: 22px; font-weight: 800; color: #1a2330; line-height: 1.2; margin-top: 3px; }
  .kpi .v small { font-size: 11px; font-weight: 700; color: #6b7789; margin-left: 2px; }
  .kpi .v .arrow { font-size: 15px; color: var(--blue-pale); margin: 0 4px; }
  .kpi .n { font-size: 10.5px; font-weight: 600; color: #7a8698; margin-top: 3px; }
  .kpi.red div { background: var(--red-tint); border-left-color: var(--red); }
  .kpi.red .k { color: var(--red); }
  .goal { margin-top: 22px; background: var(--blue-deep); color: #fff; padding: 26px 30px; display: flex; align-items: center; gap: 26px; }
  .goal .l { flex: 0 0 auto; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #8fd0ff; border-right: 1px solid rgba(255,255,255,.2); padding-right: 22px; line-height: 1.6; }
  .goal .t { font-size: 26px; font-weight: 800; line-height: 1.45; }
  .goal .t b { color: #8fd0ff; }
  .goal .d { font-size: 14px; font-weight: 600; color: #c4d2e6; margin-top: 6px; }

  /* ===== なぜ推進担当か（対比） ===== */
  .vs { display: grid; grid-template-columns: 1fr 52px 1.25fr; gap: 0; margin-top: 16px; align-items: stretch; }
  .vs .col { border: 1px solid var(--line); padding: 0; }
  .vs .col .h { font-size: 15px; font-weight: 800; padding: 12px 20px; color: #fff; background: #8a93a3; }
  .vs .col.ok .h { background: var(--blue); }
  .vs .col .b { padding: 12px 20px 14px; }
  .vs .row { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px dashed var(--line); }
  .vs .row:last-child { border-bottom: none; }
  .vs .row .ic { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
  .vs .col.ng .row .ic { background: var(--red-tint); color: var(--red); }
  .vs .col.ok .row .ic { background: var(--tint); color: var(--blue); }
  .vs .row .t { font-size: 15.5px; font-weight: 800; color: #1a2330; line-height: 1.45; }
  .vs .row .d { font-size: 13.2px; font-weight: 500; color: #4a5568; line-height: 1.7; margin-top: 4px; }
  .vs .row .d b { color: #1a2330; font-weight: 800; }
  .vs .mid { display: flex; align-items: center; justify-content: center; color: var(--blue-pale); font-size: 26px; font-weight: 900; }
  .aim { display: grid; grid-template-columns: auto 1fr 1fr; gap: 0; margin-top: 16px; border: 1.5px solid var(--blue); }
  .aim .l { background: var(--blue); color: #fff; font-size: 13.5px; font-weight: 800; padding: 14px 18px; display: flex; align-items: center; letter-spacing: .04em; }
  .aim .c { padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .aim .c + .c { border-left: 1px solid var(--line); }
  .aim .c .n { flex: 0 0 auto; width: 26px; height: 26px; background: var(--tint); color: var(--blue); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .aim .c .t { font-size: 15.5px; font-weight: 800; color: #1a2330; }
  .aim .c .d { font-size: 12.6px; font-weight: 500; color: #4a5568; margin-top: 3px; line-height: 1.5; }

  /* ===== 研修の中身 ===== */
  .step0 { display: flex; align-items: center; gap: 16px; margin-top: 18px; background: var(--tint); border: 1px solid #cfdcee; padding: 14px 20px; }
  .step0 .lb { flex: 0 0 auto; background: var(--blue); color: #fff; font-size: 12px; font-weight: 800; padding: 6px 12px; letter-spacing: .06em; }
  .step0 .t { font-size: 15.5px; font-weight: 800; color: #1a2330; }
  .step0 .mw { display: flex; gap: 8px; margin-left: auto; }
  .step0 .mw span { font-size: 12px; font-weight: 800; padding: 6px 12px; border: 1.5px solid var(--blue); color: var(--blue); background: #fff; }
  .step0 .mw span.must { background: var(--blue); color: #fff; }
  .comp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 16px; }
  .comp .c { border: 1px solid var(--line); padding: 18px 16px 16px; position: relative; }
  .comp .c .n { font-size: 11px; font-weight: 800; color: var(--blue-pale); letter-spacing: .1em; }
  .comp .c .ic { height: 84px; display: flex; align-items: flex-end; margin-top: 10px; }
  .comp .c .ic img { height: 84px; width: auto; display: block; }
  .comp .c .t { font-size: 15.5px; font-weight: 800; color: #1a2330; margin-top: 11px; line-height: 1.35; }
  .comp .c .t small { display: block; font-size: 11px; font-weight: 700; color: var(--blue); margin-top: 2px; }
  .comp .c .d { font-size: 12.3px; font-weight: 500; color: #4a5568; line-height: 1.7; margin-top: 8px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 12px; margin-top: 14px; }
  .three .c { border: 1px solid var(--line); background: #f9fafc; padding: 14px 16px; }
  .three .c .k { font-size: 12.5px; font-weight: 800; color: var(--blue); display: flex; align-items: center; gap: 7px; }
  .three .c .k::before { content: ""; width: 4px; height: 12px; background: var(--blue); }
  .three .c .d { font-size: 13px; font-weight: 500; color: #4a5568; line-height: 1.7; margin-top: 6px; }
  .three .c .d b { color: #1a2330; font-weight: 800; }

  /* ===== 学習期間・時間イメージ ===== */
  .cycle { display: flex; align-items: stretch; gap: 0; margin-top: 16px; border: 1px solid var(--line); }
  .cycle .lb { flex: 0 0 auto; width: 120px; background: var(--blue-deep); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  .cycle .lb .a { font-size: 22px; font-weight: 900; color: #8fd0ff; line-height: 1.1; }
  .cycle .lb .b { font-size: 11.5px; font-weight: 800; margin-top: 4px; letter-spacing: .06em; }
  .cycle .st { flex: 1; display: flex; align-items: center; gap: 12px; padding: 12px 18px; }
  .cycle .st + .st { border-left: 1px dashed var(--line); }
  .cycle .st .n { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--tint); color: var(--blue); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .cycle .st .t { font-size: 13.5px; font-weight: 800; color: #1a2330; }
  .cycle .st .d { font-size: 11.3px; font-weight: 500; color: #4a5568; line-height: 1.5; margin-top: 2px; }
  table.pl { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 14px; table-layout: fixed; }
  .pl th { background: var(--blue); color: #fff; font-size: 13px; font-weight: 800; padding: 10px 14px; text-align: center; letter-spacing: .02em; }
  .pl th:first-child { background: #f2f5fa; color: var(--blue-deep); text-align: left; }
  .pl th.rec { background: var(--blue-deep); }
  .pl th.rec small { display: inline-block; margin-left: 8px; font-size: 10.5px; font-weight: 800; color: var(--blue-deep); background: #8fd0ff; padding: 2px 8px; border-radius: 999px; vertical-align: middle; }
  .pl td { font-size: 13px; font-weight: 600; color: #4a5568; padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: center; line-height: 1.5; }
  .pl td:first-child { text-align: left; font-weight: 800; color: #1a2330; background: #f9fafc; }
  .pl td b { font-size: 18px; font-weight: 800; color: #1a2330; }
  .pl td b.hi { color: var(--blue-bright); }
  .pl td small { display: block; font-size: 10.5px; font-weight: 600; color: #8a93a3; margin-top: 1px; }

  /* ===== セキュリティ ===== */
  .sec3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 22px; }
  .sec3 .c { border: 1px solid var(--line); padding: 26px 24px 24px; display: flex; flex-direction: column; }
  .sec3 .c .ex { margin-top: auto !important; }
  .sec3 .c .d { padding-bottom: 14px; }
  .sec3 .c .ic { height: 104px; display: flex; align-items: flex-end; }
  .sec3 .c .ic img { height: 104px; width: auto; display: block; }
  .sec3 .c .n { font-size: 11.5px; font-weight: 800; color: var(--blue-pale); letter-spacing: .12em; margin-top: 18px; }
  .sec3 .c .t { font-size: 19px; font-weight: 800; color: #1a2330; line-height: 1.4; margin-top: 5px; }
  .sec3 .c .d { font-size: 14px; font-weight: 500; color: #4a5568; line-height: 1.85; margin-top: 10px; }
  .sec3 .c .d b { color: #1a2330; font-weight: 800; }
  .sec3 .c .ex { margin-top: 14px; background: #f9fafc; border: 1px dashed #cfd7e2; padding: 10px 13px; font-size: 12.3px; font-weight: 600; color: #5a6578; line-height: 1.65; }
  .sec3 .c .ex b { color: var(--blue); font-weight: 800; }

  /* ===== 助成金を使わない理由 ===== */
  .rs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-top: 12px; }
  .rs .r { display: flex; gap: 16px; border: 1px solid var(--line); padding: 11px 18px 11px 16px; }
  .rs .r .n { flex: 0 0 auto; width: 34px; height: 34px; background: var(--blue-deep); color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .rs .r .t { font-size: 15.5px; font-weight: 800; color: #1a2330; line-height: 1.4; }
  .rs .r .d { font-size: 12.6px; font-weight: 500; color: #4a5568; line-height: 1.65; margin-top: 4px; }
  table.cmp { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 12px; table-layout: fixed; }
  .cmp th { font-size: 13px; font-weight: 800; padding: 8px 16px; text-align: left; }
  .cmp th:first-child { background: #f2f5fa; color: var(--blue-deep); }
  .cmp th.ng { background: #8a93a3; color: #fff; }
  .cmp th.ok { background: var(--blue); color: #fff; }
  .cmp td { font-size: 12.8px; font-weight: 600; color: #4a5568; padding: 7px 16px; border-bottom: 1px solid var(--line); line-height: 1.55; }
  .cmp td:first-child { font-weight: 800; color: #1a2330; background: #f9fafc; }
  .cmp td.ok { background: var(--tint); color: #1a2330; font-weight: 700; }
  .cmp td.ok b { color: var(--blue-bright); font-weight: 800; }
  .rs .r .d b { color: #1a2330; font-weight: 800; }
  .rs .r.wide { grid-column: 1 / -1; }

  /* ===== 料金 ===== */
  table.pr { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 16px; table-layout: fixed; }
  .pr th { background: var(--blue); color: #fff; font-size: 14px; font-weight: 800; padding: 13px 16px; text-align: center; }
  .pr th:first-child { background: #f2f5fa; color: var(--blue-deep); text-align: left; }
  .pr th.sp { background: var(--blue-deep); }
  .pr td { padding: 24px 16px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
  .pr td:first-child { text-align: left; background: #f9fafc; }
  .pr td .pn { font-size: 21px; font-weight: 800; color: #1a2330; }
  .pr td .pd { font-size: 12.5px; font-weight: 600; color: #6b7789; margin-top: 5px; line-height: 1.6; }
