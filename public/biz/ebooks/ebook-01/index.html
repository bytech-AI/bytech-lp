<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サービス概要資料｜全24スライド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* デザイン: Loglass 会社紹介資料（CompanyDeck）準拠。
     フラットなロイヤルブルー／白背景＋角丸カード＋淡いシャドウ／青単色アクセント／
     小さな左上ヘッダー＋右上ロゴ／グレーの素のページ番号／フラットブルーの章扉。
     文言は Canva 原本「バイテックBizサービス概要【共有資料】」に忠実。 */
  :root {
    --blue: #2b51c7;
    --tint: #eef2fc;
    --tint2: #f5f8fe;
    --ink: #1e2b46;
    --body: #3a4660;
    --gray: #5a6b85;
    --faint: #9aa7bd;
    --line: #e6eaf2;
    --gold: #c9a84c;
    --card-r: 20px;
    --shadow: 0 10px 30px rgba(30,60,140,.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4f6f8; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; color: var(--ink); padding: 48px 0 96px; }
  .note { max-width: 1120px; margin: 0 auto 28px; font-size: 13px; font-weight: 700; color: #8a93a3; }
  .en { font-family: Poppins, "Noto Sans JP", sans-serif; }

  .deck { display: flex; flex-direction: column; gap: 34px; align-items: center; }
  .slide-shell { width: 1120px; }
  .slide-shell figcaption { font-size: 12px; font-weight: 700; color: #8a93a3; margin: 8px 2px 0; letter-spacing: .04em; }
  .slide { width: 1280px; height: 720px; transform: scale(0.875); transform-origin: top left; background: #fff; position: relative; overflow: hidden; }
  .slide-shell .clip { height: 630px; overflow: hidden; border-radius: 8px; box-shadow: 0 2px 10px rgba(26,35,48,.08); }

  /* ===== 共通（Loglass の白スライド様式） ===== */
  .s-body { position: absolute; inset: 0; padding: 46px 64px; }
  .s-head { font-size: 15.5px; font-weight: 700; color: #2a3a5c; letter-spacing: .05em; }
  .s-head .var { color: var(--blue); }
  .s-logo { position: absolute; top: 42px; right: 64px; height: 34px; }
  .s-lead { text-align: center; font-size: 26px; font-weight: 900; line-height: 1.7; color: var(--ink); letter-spacing: .03em; }
  .s-lead b { color: var(--blue); }
  .s-foot { position: absolute; left: 64px; bottom: 20px; font-size: 12.5px; font-weight: 500; color: var(--faint); z-index: 5; }
  .s-pn { position: absolute; right: 28px; bottom: 16px; font-family: Poppins, sans-serif; font-size: 15px; font-weight: 500; color: #b6bec9; z-index: 5; }
  .blue-flat { background: var(--blue); color: #fff; }
  .blue-flat .s-foot { color: rgba(255,255,255,.75); }
  .blue-flat .s-pn { color: rgba(255,255,255,.6); }

  /* ===== 表紙 ===== */
  .cover .wm { position: absolute; right: -170px; bottom: -130px; height: 540px; opacity: .08; transform: rotate(-8deg); }
  .cover .logo { position: absolute; top: 232px; left: 50%; transform: translateX(-50%); height: 98px; }
  .cover .sub { position: absolute; top: 398px; left: 0; right: 0; text-align: center; font-size: 25px; font-weight: 700; letter-spacing: .08em; }
  .cover .sub i { font-style: normal; opacity: .55; padding: 0 14px; font-weight: 400; }
  .cover .date { position: absolute; top: 456px; left: 0; right: 0; text-align: center; font-family: Poppins, "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 500; letter-spacing: .2em; opacity: .75; }
  .cover .secret { position: absolute; left: 0; right: 0; bottom: 38px; text-align: center; font-size: 11px; font-weight: 400; line-height: 1.9; opacity: .65; }

  /* ===== 目次（Loglass 様式） ===== */
  .toc { margin: 76px 0 0 150px; display: flex; flex-direction: column; gap: 44px; }
  .toc .row { display: flex; align-items: baseline; gap: 34px; }
  .toc .no { font-family: Poppins, sans-serif; flex: 0 0 auto; font-size: 24px; font-weight: 600; color: var(--blue); letter-spacing: .06em; }
  .toc .t { font-size: 27px; font-weight: 900; color: var(--ink); letter-spacing: .04em; }
  .toc .d { font-size: 14px; font-weight: 500; color: var(--gray); margin-top: 7px; letter-spacing: .04em; }

  /* ===== 章扉（フラットブルー） ===== */
  .divider .no { position: absolute; top: 318px; left: 170px; font-family: Poppins, sans-serif; font-size: 52px; font-weight: 600; color: rgba(255,255,255,.45); line-height: 1; }
  .divider .t { position: absolute; top: 316px; left: 258px; font-size: 44px; font-weight: 900; letter-spacing: .06em; line-height: 1.2; }

  /* ===== 研修プラン（比較表） ===== */
  table.cmp { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 42px; font-size: 13.5px; }
  .cmp th, .cmp td { padding: 6px 8px; text-align: center; vertical-align: middle; border-bottom: 1px solid var(--line); }
  .cmp thead th { border-bottom: none; padding: 0 5px 10px; }
  .cmp thead .hx { display: block; background: var(--blue); color: #fff; font-size: 16.5px; font-weight: 700; padding: 12px 6px; border-radius: 0; letter-spacing: .02em; }
  .cmp thead th.h3 .hx { background: #1e3a94; }
  .cmp .rh { color: var(--ink); font-weight: 700; width: 142px; font-size: 13px; text-align: left; padding-left: 4px; }
  .cmp td { font-weight: 500; color: var(--body); line-height: 1.5; }
  .cmp td .em { color: var(--blue); font-weight: 700; }
  .cmp td .big { font-family: Poppins, "Noto Sans JP", sans-serif; font-size: 19px; font-weight: 600; color: var(--ink); }
  .cmp td .big small { font-family: "Noto Sans JP", sans-serif; font-size: 11px; font-weight: 500; color: var(--gray); }
  .cmp td .cl6 { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; font-size: 11.3px; font-weight: 500; text-align: left; padding: 0 4px; color: var(--body); }
  .cmp .pill { display: block; background: var(--tint); color: var(--blue); font-size: 11.3px; font-weight: 700; border-radius: 999px; padding: 4px 8px; margin: 2.5px auto; max-width: 250px; }

  /* ===== 学習環境（原本の破線枠×青ヘッダーバー） ===== */
  .env2 { display: grid; grid-template-columns: 1fr 84px 1fr; align-items: stretch; margin: 58px -20px 0; }
  .env { background: #fff; border: 2px dashed #6f8fd6; padding: 20px 22px 26px; }
  .env .eh { position: relative; background: var(--blue); color: #fff; text-align: center; font-size: 25px; font-weight: 900; padding: 13px 12px; letter-spacing: .04em; }
  .env .eh small { position: absolute; right: 10px; bottom: 7px; font-size: 10.5px; font-weight: 500; color: #d7e0f8; margin: 0; }
  .env .lead { text-align: center; font-size: 20.5px; font-weight: 900; color: var(--ink); line-height: 1.75; margin: 18px 0 17px; }
  .env-x { display: flex; align-items: center; justify-content: center; font-size: 58px; font-weight: 900; color: #1e2b46; }
  .mini6 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(30,60,140,.10); padding: 12px; }
  .mini6 .mc { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 11px 10px; }
  .mini6 .mc .t { display: flex; align-items: center; gap: 6px; font-size: 11.8px; font-weight: 700; color: var(--ink); }
  .mini6 .mc .t i { flex: 0 0 auto; width: 15px; height: 15px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-size: 8px; font-weight: 600; font-style: normal; }
  .mini6 .mc .t img { flex: 0 0 auto; width: 16px; height: 16px; }
  .mini6 .mc .t .mono { flex: 0 0 auto; width: 15px; height: 15px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-size: 8px; font-weight: 600; }
  .mini6 .mc .d { font-size: 10.4px; font-weight: 500; color: var(--gray); margin-top: 4px; }
  .mini5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(30,60,140,.10); padding: 12px; }
  .mini5 .mc { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 15px 6px; text-align: center; }
  .mini5 .mc svg { display: block; margin: 0 auto 6px; }
  .mini5 .mc img.il { display: block; height: 40px; max-width: 100%; object-fit: contain; margin: 0 auto 8px; }
  .mini5 .mc .t { font-size: 11px; font-weight: 700; color: var(--ink); line-height: 1.5; }

  /* ===== 6コース ===== */
  .course6 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 16px; }
  .c6 { background: #fff; border: 1px solid #eef1f7; border-radius: 0; padding: 13px 15px; box-shadow: var(--shadow); }
  .c6 .h { display: flex; align-items: center; gap: 9px; font-size: 15.5px; font-weight: 900; color: var(--ink); }
  .c6 .h .no { font-family: Poppins, sans-serif; flex: 0 0 auto; font-size: 15px; font-weight: 600; color: var(--blue); }
  .c6 .h .ic { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 0; background: var(--tint); display: flex; align-items: center; justify-content: center; }
  .c6 .h .ic img { width: 19px; height: 19px; }
  .c6 .h .ic .mono { width: 20px; height: 20px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-size: 9px; font-weight: 700; }
  .c6 .meta { display: flex; gap: 6px; margin-top: 8px; }
  .c6 .m { flex: 1; background: var(--tint2); border-radius: 0; text-align: center; padding: 6px 3px; }
  .c6 .m .k { font-size: 10px; font-weight: 700; color: var(--blue); }
  .c6 .m .v { font-size: 11.8px; font-weight: 700; color: var(--ink); line-height: 1.35; }
  .c6 .m .v b { font-family: Poppins, "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 600; }
  .c6 .d { font-size: 11.8px; font-weight: 500; color: var(--body); line-height: 1.6; margin-top: 7px; }
  .c6 .tg { display: flex; align-items: flex-start; gap: 7px; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 11.2px; font-weight: 500; color: var(--body); line-height: 1.5; }
  .c6 .tg .lb { flex: 0 0 auto; background: var(--tint); color: var(--blue); font-size: 10px; font-weight: 700; border-radius: 0; padding: 2px 7px; }

  /* ===== サポート体制（原本準拠：塗りアイコン＋下線＋イラスト） ===== */
  .sup5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin: 92px -24px 0; }
  .sp { text-align: center; }
  .sp .ico { width: 96px; height: 96px; margin: 0 auto; border-radius: 50%; background: #e4ecfa; display: flex; align-items: center; justify-content: center; }
  .sp .t { font-size: 16.5px; font-weight: 900; color: var(--blue); line-height: 1.45; min-height: 58px; display: flex; align-items: flex-end; justify-content: center; margin-top: 12px; padding-bottom: 10px; }
  .sp .bar { width: 100%; height: 2px; background: var(--blue); }
  .sp .ill { height: 128px; display: flex; align-items: center; justify-content: center; margin-top: 20px; }
  .sp .ill img { max-width: 100%; max-height: 100%; }
  .sp .d { font-size: 12.8px; font-weight: 600; color: var(--ink); line-height: 2; margin-top: 18px; text-align: center; }

  /* ===== スケジュール ===== */
  .total-days { text-align: center; font-size: 25px; font-weight: 900; color: var(--ink); }
  .total-days b { font-family: Poppins, "Noto Sans JP", sans-serif; font-size: 54px; color: var(--blue); font-weight: 600; padding: 0 10px; }
  .phase-row { display: grid; margin: 26px -28px 0; align-items: stretch; }
  .phase-row.p3 { grid-template-columns: 1fr 36px 1fr 36px 1fr; }
  .phase-row.p4 { grid-template-columns: 1fr 24px 1fr 24px 1fr 24px 1fr; }
  .ph .hh { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--pc); color: #fff; padding: 8px 10px; }
  .ph .hh .p { font-family: Poppins, sans-serif; font-size: 12.5px; font-weight: 600; border: 1.5px solid rgba(255,255,255,.9); padding: 3px 10px; white-space: nowrap; }
  .ph .hh .t { font-size: 16.5px; font-weight: 900; }
  .ph .hh .d { font-size: 12px; font-weight: 700; border: 1.5px solid rgba(255,255,255,.9); padding: 3px 9px; white-space: nowrap; }
  .ph .goal { text-align: center; font-size: 13.4px; font-weight: 900; color: var(--pc); margin: 13px 0 2px; line-height: 1.45; }
  .ph .it { display: flex; align-items: center; gap: 12px; background: var(--tc); padding: 10px 12px; margin-top: 10px; min-height: 84px; }
  .ph .it .ic { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; color: var(--pc); }
  .ph .it .tx .t { font-size: 13.8px; font-weight: 900; color: var(--ink); line-height: 1.4; }
  .ph .it .tx .d { font-size: 10.8px; font-weight: 500; color: var(--body); line-height: 1.5; margin-top: 3px; }
  .ph-arrow { display: flex; align-items: center; justify-content: center; }
  .ph-arrow::before { content: ""; width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 15px solid var(--pc); opacity: .9; }
  .day-bar { display: flex; gap: 20px; margin: 24px -28px 0; }
  .day-bar span { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--pc); font-size: 13.5px; font-weight: 600; font-family: Poppins, "Noto Sans JP", sans-serif; white-space: nowrap; }
  .day-bar .dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--pc); }
  .day-bar .ln { flex: 1; height: 2.5px; background: var(--pc); }

  /* ===== 料金 ===== */
  .price3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 26px; margin-top: 38px; }
  .pc { background: #fff; border: 1px solid #eef1f7; border-radius: 0; box-shadow: var(--shadow); text-align: center; padding: 20px 18px; display: flex; flex-direction: column; }
  .pc .hh { font-size: 20px; font-weight: 900; color: var(--ink); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .pc .hh b { font-family: Poppins, "Noto Sans JP", sans-serif; font-size: 24px; font-weight: 600; color: var(--blue); }
  .pc .sec { padding: 16px 0 12px; min-height: 122px; display: flex; flex-direction: column; justify-content: center; }
  .pc .k { font-size: 12.5px; font-weight: 700; color: var(--gray); }
  .pc .v { font-family: Poppins, "Noto Sans JP", sans-serif; font-size: 31px; font-weight: 600; color: var(--ink); line-height: 1.35; }
  .pc .v small { font-family: "Noto Sans JP", sans-serif; font-size: 13px; font-weight: 500; color: var(--gray); }
  .pc .sum { font-size: 13px; font-weight: 700; color: var(--body); }
  .pc .arrow { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 10px solid #c9d2e4; margin: 4px auto; }
  .pc .net { background: var(--tint); border-radius: 0; padding: 13px 8px; margin-top: 8px; min-height: 104px; display: flex; flex-direction: column; justify-content: center; }
  .pc .net .k, .pc .net .v, .pc .net .sum { color: var(--blue); }
  .pc .total { background: var(--blue); color: #fff; border-radius: 0; padding: 12px 8px 14px; margin-top: auto; }
  .pc .total .k { color: #d7e0f8; font-size: 12px; }
  .pc .total .v { color: #fff; font-size: 28px; }

  /* ===== 導入実績 ===== */
  .laurel-row { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 42px; }
  .laurel-row .mid { text-align: center; }
  .laurel-row .mid .t { font-size: 19px; font-weight: 900; color: var(--ink); letter-spacing: .06em; }
  .laurel-row .mid .v { font-family: Poppins, "Noto Sans JP", sans-serif; font-size: 64px; font-weight: 600; color: var(--blue); line-height: 1.15; }
  .laurel-row .mid .v small { font-family: "Noto Sans JP", sans-serif; font-size: 30px; font-weight: 900; }
  .logo-wall { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px 46px; margin: 40px auto 0; max-width: 1040px; }
  .logo-wall .co { font-size: 20px; font-weight: 900; color: #3a4457; letter-spacing: .04em; }
  .donut2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 880px; margin: 52px auto 0; }
  .dn { display: flex; align-items: center; justify-content: center; gap: 30px; }
  .donut { width: 172px; height: 172px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .donut .hole { width: 106px; height: 106px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18.5px; font-weight: 900; color: var(--ink); text-align: center; line-height: 1.5; }
  .dn .pct { font-family: Poppins, "Noto Sans JP", sans-serif; font-size: 68px; font-weight: 600; color: var(--blue); }
  .dn .pct small { font-size: 30px; }

  /* ===== 導入事例 ===== */
  .case-top { display: grid; grid-template-columns: 356px 1fr; gap: 34px; background: var(--tint2); border: 1px solid #eef1f7; border-radius: 0; padding: 20px 28px; margin-top: 44px; align-items: center; }
  .case-top .co { text-align: center; }
  .case-top .co .nm { font-size: 24px; font-weight: 900; color: var(--ink); line-height: 1.5; }
  .case-top .co .lg { font-family: Poppins, sans-serif; font-size: 26px; font-weight: 700; color: #46536b; letter-spacing: .12em; margin-top: 8px; }
  .case-info .r { display: grid; grid-template-columns: 106px 1fr; gap: 16px; padding: 7px 0; border-bottom: 1px solid #e2e8f2; }
  .case-info .r:last-child { border-bottom: none; }
  .case-info .k { font-size: 13px; font-weight: 900; color: var(--ink); padding-top: 1px; }
  .case-info .v { font-size: 12.4px; font-weight: 500; color: var(--body); line-height: 1.65; }
  .case-info .v b { font-weight: 700; color: var(--ink); }
  .case3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-top: 16px; }
  .cs { background: #fff; border: 1px solid #eef1f7; border-radius: 0; box-shadow: var(--shadow); padding: 14px 18px 12px; }
  .cs.result { background: var(--blue); border-color: var(--blue); }
  .cs .h { text-align: center; font-size: 16px; font-weight: 900; color: var(--ink); padding-bottom: 9px; border-bottom: 1px solid var(--line); }
  .cs.result .h { color: #fff; border-bottom-color: rgba(255,255,255,.3); }
  .cs .bt { font-size: 13.8px; font-weight: 700; color: var(--ink); display: flex; gap: 7px; align-items: center; margin-top: 9px; }
  .cs .bt::before { content: "✓"; flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
  .cs.result .bt { color: #fff; }
  .cs.result .bt::before { background: #fff; color: var(--blue); }
  .cs .bd { font-size: 11.5px; font-weight: 500; color: var(--body); line-height: 1.6; margin: 3px 0 5px 23px; }
  .cs.result .bd { color: #dfe7fb; }

  /* ===== 講師紹介 ===== */
  .tutor6 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 46px; margin-top: 48px; }
  .tu { display: flex; gap: 18px; }
  .tu .av { flex: 0 0 auto; width: 112px; height: 140px; object-fit: cover; object-position: center top; }
  .tu .role { font-size: 13px; font-weight: 700; color: var(--blue); }
  .tu .nm { font-size: 20px; font-weight: 900; color: var(--ink); margin-top: 1px; }
  .tu .fld { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--ink); }
  .tu .fld .lb { flex: 0 0 auto; background: var(--tint); color: var(--blue); font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 2px 8px; }
  .tu .bio { font-size: 11.7px; font-weight: 500; color: var(--body); line-height: 1.65; margin-top: 6px; }

  /* ===== FAQ ===== */
  .faq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 64px; margin-top: 30px; align-content: start; }
  .qa { padding: 15px 2px 17px; border-bottom: 1px solid var(--line); }
  .faq-grid .qa:nth-last-child(-n+2) { border-bottom: none; }
  .qa .q { display: flex; align-items: flex-start; gap: 11px; font-size: 15px; font-weight: 900; color: var(--ink); line-height: 1.5; }
  .qa .q::before { content: "Q"; font-family: Poppins, sans-serif; flex: 0 0 auto; width: 23px; height: 23px; border-radius: 6px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }
  .qa .a { display: block; font-size: 12px; font-weight: 500; color: var(--body); line-height: 1.75; margin: 7px 0 0 34px; }
  .qa .a .em { color: var(--blue); font-weight: 700; }
  .qa .chips { display: flex; flex-wrap: wrap; gap: 6px 7px; margin: 8px 0 0 34px; }
