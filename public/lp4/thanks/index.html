<style>

  html, body { margin: 0; padding: 0; }

    align-items: center;

    font-weight: 700;

  @media (min-width: 768px) {

  .line-block__body { padding: 22px 18px 24px; text-align: center; }
  .hero .line-block__lead {

    font-size: 15px;

  .hero .line-block__note {
    margin: 0 0 18px;

    font-weight: 700;
    color: var(--color-text);
    line-height: 1.8;
  }
  .line-block__note em {
    display: inline-block;
    font-style: normal;
    color: #E0245E;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .line-cta {
    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto;

    background: #06C755;
    color: #fff;
    border-radius: 999px;
    text-decoration: none;
    font-size: 17px;
    font-weight: 800;

    box-shadow: 0 6px 16px rgba(6, 199, 85, .28);

  .line-cta:hover { background: #05B84E; transform: translateY(-1px); }
  .line-cta__mark {

    width: 30px; height: 30px;
    background: #fff;
    color: #06C755;
    border-radius: 50%;

    align-items: center;
    justify-content: center;
    font-size: 10px;

    letter-spacing: 0;

  .line-cta__arrow { flex: 0 0 auto; font-size: 13px; opacity: .9; }
  .hero .line-block__timer {

    <h1>ご予約ありがとうございます！<br>当日お会いできるのを楽しみにしております。</h1>

      ご入力いただいたメールアドレス宛に、ご予約内容のご案内をお送りしました。
    </p>
    <div class="line-block">
      <p class="line-block__head">LINE友だち追加</p>
      <div class="line-block__body">
        <p class="line-block__lead">セミナー参加特典はLINEでお送りします</p>
        <p class="line-block__note">特典受け取りのために<br><em>LINE友だち追加を忘れずにお願いします</em></p>
        <a class="line-cta" id="lineCta" href="https://line-harness.customer-success-d39.workers.dev/r/b-college-asp?account=2010623910" rel="noopener">

          <span>LINE友だち追加</span>
          <span class="line-cta__arrow">&#9654;</span>
        </a>
        <p class="line-block__timer" id="lineTimer"><span id="lineCount">20</span>秒後にLINEへ自動で遷移します</p>
      </div>

<script>
(function(){
  var SEC = 20;
  var cta = document.getElementById('lineCta');
  var out = document.getElementById('lineCount');
  var box = document.getElementById('lineTimer');
  if (!cta || !out) return;
  // 予約日(?d=YYYY-MM-DD)をLINEのURLに引き継ぐ。書式を検証してから連結する
  var qd = new URLSearchParams(location.search).get('d');
  if (qd && /^\d{4}-\d{2}-\d{2}$/.test(qd)) {
    cta.href = cta.getAttribute('href') + '&d=' + qd;
  }
  var url = cta.getAttribute('href');
  var left = SEC, stopped = false;
  function stop(reason){
    if (stopped) return;
    stopped = true;
    clearInterval(t);
    if (box) box.textContent = reason;
  }
  // ユーザーが自分で操作したら自動遷移はやめる
  cta.addEventListener('click', function(){ stop('LINEを開いています…'); });
  ['keydown','wheel','touchmove'].forEach(function(ev){
    window.addEventListener(ev, function(){ stop('自動遷移を停止しました。上のボタンから追加できます。'); }, { once: true, passive: true });
  });
  var t = setInterval(function(){
    left -= 1;
    if (left <= 0){
      clearInterval(t);
      if (!stopped) window.location.href = url;
      return;
    }
    out.textContent = left;
  }, 1000);
})();
</script>
