<title>ご予約ありがとうございます – バイテック | 無料個別カウンセリング</title>
<style>
  :root {
    --color-primary: #533AFC;
    --color-primary-dark: #3D28D4;
    --color-accent: #533AFC;
    --color-text: #0F172A;
    --color-muted: #64748B;
    --color-bg: #F8FAFC;
    --color-surface: #FFFFFF;
    --color-border: #E2E8F0;
    --color-footer-bg: #000000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    color: var(--color-text);
    background: var(--color-bg);
    line-height: 1.7;
  }
  header {
    background: #ffffff;
    border-bottom: 1px solid var(--color-border);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header .brand {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
  }
  header .brand img {
    display: block;
    height: 36px;
    width: auto;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 16px 64px;
  }
  .hero {
    background: var(--color-surface);
    border-radius: 14px;
    box-shadow: 0 6px 28px rgba(15, 23, 42, .06);
    padding: 36px 20px;
    text-align: center;
  }
  .eyebrow {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .24em;
    color: var(--color-accent);
    margin: 0 0 12px;
  }
  .hero h1 {
    font-size: clamp(22px, 4.4vw, 32px);
    font-weight: 800;
    margin: 0 0 16px;
    line-height: 1.45;
  }
  .hero p {
    margin: 0;
    color: var(--color-muted);
    font-size: 15px;
    line-height: 1.85;
  }
  .form-section {
    background: var(--color-surface);
    border-radius: 14px;
    box-shadow: 0 6px 28px rgba(15, 23, 42, .06);
    margin-top: 24px;
    padding: 28px 16px 16px;
  }
  .form-section h2 {
    font-size: clamp(18px, 3.4vw, 22px);
    font-weight: 800;
    margin: 0 0 8px;
    text-align: center;
  }
  .form-section .lead {
    margin: 0 0 16px;
    text-align: center;
    color: var(--color-muted);
    font-size: 14px;
  }
  .form-frame {
    width: 100%;
    height:70vh;min-height:480px;max-height:720px;
    border: 0;
    display: block;
  }
  /* formrun 埋め込み: SDK が高さを自動設定するが、読み込み/調整前でも表示されるよう最低高さを確保 */
  .formrun-embed { width: 100%; }
  .formrun-embed iframe { width: 100%; min-height: 560px; border: 0; display: block; }
  @media (min-width: 768px) {
    main { padding: 56px 20px 80px; }
    .hero { padding: 48px 36px; }
    .form-section { padding: 32px 28px 20px; }
    .form-frame { height: 75vh; min-height: 560px; max-height: 820px; }
  }
  footer {
    background: var(--color-footer-bg);
    color: #fff;
    padding: 28px 20px;
    text-align: center;
    font-size: 12px;
    opacity: .9;
  }
  footer p { margin: 0; }
</style>
<style id="bt-heading-weight">h2{font-weight:900!important}h3{font-weight:800!important}</style></head>

<main>
  <section class="hero">
    <p class="eyebrow">THANK YOU</p>
    <h1>無料個別カウンセリングの<br>ご予約ありがとうございます！</h1>
    <p>
      ご入力いただいたメールアドレス宛に、<br>

      届かない場合は、迷惑メールフォルダもご確認ください。
    </p>
  </section>
  <section class="form-section">
    <h2>事前カウンセリングシートのご記入のお願い</h2>
    <p class="lead">当日のカウンセリングを充実させるため、以下フォームへのご記入をお願いいたします。</p>
