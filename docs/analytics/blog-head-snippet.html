<!-- 流入元メモ (bytech.jp の各LPと同じ btRefInfo)。検索→ブログ着地時の紹介元(ref=google…)と最初のパス(landing=/blog/記事名)を保持し、
     LP側(/counseling, /diagnosis, トップのカレンダー)が予約時に ref / lp_query / landing として GAS→CRM へ送る。
     ブログ→LP のリンクは別タブ(rel=noopener)で開くので sessionStorage は引き継がれない。そのため localStorage にも30分の写しを置く。 -->
<script>window.btRefInfo=window.btRefInfo||function(){var k='bt_ref_v1',t=30*60*1000,v=null,r=document.referrer||'',q=(location.search||'').slice(1),ext=false,now=Date.now();try{v=JSON.parse(sessionStorage.getItem(k)||'null')}catch(e){}try{ext=!!r&&new URL(r).host!==location.host}catch(e){}if(!v&&!ext&&!q){try{var c=JSON.parse(localStorage.getItem(k)||'null');if(c&&c.ts&&now-c.ts<t){v={ref:c.ref||'',q:c.q||'',landing:c.landing||''}}}catch(e){}}if(!v||ext){v={ref:r,q:q,landing:location.pathname}}try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}try{localStorage.setItem(k,JSON.stringify({ref:v.ref,q:v.q,landing:v.landing,ts:now}))}catch(e){}return v};window.btRefInfo();</script>
