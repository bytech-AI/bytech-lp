<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>経理・財務のAI・自動化アイデア10選｜全23スライド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* 業種別 活用事例集。設計は ebook-04/05 と同系統（四角の角丸なし・円とピルのみ角丸）。
     ★事例はすべて各社の公開情報にもとづく。数値は出典の表記どおりに記載し、推測で丸めたり
       脚色したりしないこと。出典はスライド下部に必ず明記する。他社名を出す資料のため、
       まとめサイトの孫引きは使わず一次情報（プレスリリース・公式サイト）で裏を取る。 */
  :root {
    --blue: #2c5c9c; --blue-deep: #1a2e50; --blue-bright: #1a6fb5; --blue-pale: #8fb0d8;
    --ink: #2a2f3a; --line: #e3e8ef; --amber: #f0b429; --tint: #eef4fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4f6f8; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; color: var(--ink); padding: 48px 0 96px; }
  .note { max-width: 1120px; margin: 0 auto 28px; font-size: 13px; font-weight: 700; color: #8a93a3; }
  .en { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; }

  .deck { display: flex; flex-direction: column; gap: 34px; align-items: center; counter-reset: pg -1; }
  .slide-shell { width: 1120px; counter-increment: pg; }
  .slide-shell figcaption { font-size: 12px; font-weight: 700; color: #8a93a3; margin: 8px 2px 0; letter-spacing: .04em; }
  .slide { width: 1280px; height: 720px; transform: scale(0.875); transform-origin: top left; background: #fff; position: relative; overflow: hidden; }
  .slide-shell .clip { height: 630px; overflow: hidden; border-radius: 0; box-shadow: 0 2px 10px rgba(26,35,48,.08); }

  /* ===== 共通 ===== */
  .s-body { position: absolute; inset: 0; padding: 36px 56px; z-index: 1; }
  .s-eyebrow { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; color: var(--blue-pale); letter-spacing: .02em; }
  .s-eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
  .s-logo { position: absolute; top: 38px; right: 56px; height: 30px; }
  .s-foot { position: absolute; left: 56px; right: 120px; bottom: 14px; font-size: 10px; color: #9aa3b2; line-height: 1.6; z-index: 5; }
  .s-num { position: absolute; right: 0; bottom: 0; width: 66px; height: 66px; background: var(--blue); border-radius: 66px 0 0 0; color: #fff; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 13px; font-weight: 700; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 14px 10px 0; z-index: 5; }
  .s-num::before { content: counter(pg); }

  /* ===== 見出し行（業種バッジ＋要点） ===== */
  .hd { display: flex; align-items: center; gap: 18px; margin-top: 8px; }
  .hd .badge { background: var(--blue); color: #fff; font-size: 24px; font-weight: 800; padding: 10px 22px; letter-spacing: .06em; white-space: nowrap; text-align: center; }
  .hd .badge small { display: block; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; opacity: .8; margin-top: 3px; }
  .hd .t { font-size: 25px; font-weight: 800; color: #1a2330; line-height: 1.4; letter-spacing: .01em; }
  .hd .t b { color: var(--blue-bright); }

  /* ===== 事例テーブル ===== */
  table.cs { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 18px; table-layout: fixed; }
  .cs th { background: var(--blue); color: #fff; font-size: 13px; font-weight: 800; padding: 10px 14px; text-align: left; letter-spacing: .02em; }
  .cs th:first-child { text-align: center; }
  .cs td { font-size: 12.8px; font-weight: 500; color: #4a5568; padding: 13px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; line-height: 1.55; }
  .cs tr:nth-child(even) td { background: #f7f9fc; }
  .cs td.no { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; text-align: center; font-weight: 800; color: var(--blue-pale); }
  /* 社名は他社商標のためロゴを使わず、文字組みだけで見せる */
  .cs td.co span { display: block; font-size: 14.5px; font-weight: 800; color: #1a2330; line-height: 1.4; }
  .cs td.ar span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: var(--blue); background: var(--tint); border: 1px solid #d5e3f4; padding: 4px 9px; white-space: nowrap; }
  .cs td.ar svg { flex: 0 0 auto; }
  .cs td.rs { font-size: 13px; font-weight: 700; color: #1a2330; line-height: 1.5; }
  .cs td.rs b { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 19px; font-weight: 800; color: var(--blue-bright); padding: 0 1px; }

  /* ===== まとめ帯 ===== */
  .band { display: flex; align-items: center; gap: 11px; background: var(--tint); border: 1.5px solid var(--blue); padding: 12px 20px; font-size: 13.5px; font-weight: 800; color: var(--blue-deep); margin-top: 12px; }
  .band::before { content: "✓"; flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }


  /* ===== 個別詳細スライド ===== */
  .dhd { display: flex; align-items: flex-start; gap: 18px; margin-top: 8px; }
  .dhd .no { background: var(--blue-deep); color: #fff; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 22px; font-weight: 800; padding: 12px 18px; letter-spacing: .06em; }
  .dhd .mark { flex: 0 0 auto; width: 46px; height: 46px; background: var(--tint); border: 1.5px solid #cfdcee; color: var(--blue); display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .dhd .mark svg { width: 24px; height: 24px; }
  .dhd .co { font-size: 25px; font-weight: 800; color: #1a2330; line-height: 1.3; }
  .dhd .co small { display: block; font-size: 14px; font-weight: 700; color: #6b7789; margin-top: 5px; }
  .dhd .tags { margin-left: auto; display: flex; gap: 7px; padding-top: 6px; }
  .dhd .tags span { font-size: 11.5px; font-weight: 800; color: var(--blue); background: var(--tint); border: 1px solid #d5e3f4; border-radius: 999px; padding: 5px 13px; white-space: nowrap; }

  .dt { display: grid; grid-template-columns: 1.18fr 1fr; gap: 20px; margin-top: 14px; align-items: start; }
  .sec { border: 1px solid var(--line); }
  .sec .h { background: #f2f5fa; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 800; color: var(--blue-deep); padding: 9px 16px; display: flex; align-items: center; gap: 8px; }
  .sec .h::before { content: ""; width: 5px; height: 15px; background: var(--blue); }
  .sec .b { padding: 10px 16px 11px; }
  .sec .i { position: relative; font-size: 12.6px; font-weight: 500; color: #4a5568; line-height: 1.7; padding: 4px 0 4px 15px; }
  .sec .i::before { content: ""; position: absolute; left: 0; top: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue-pale); }
  .sec .i b { color: #1a2330; font-weight: 800; }

  .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi div { background: var(--tint); border-left: 4px solid var(--blue); padding: 11px 13px; }
  .kpi .k { font-size: 10.5px; font-weight: 800; color: var(--blue); }
  .kpi .v { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 24px; font-weight: 800; color: #1a2330; line-height: 1.15; margin-top: 3px; }
  .kpi .v small { font-family: "Noto Sans JP", sans-serif; font-size: 11px; font-weight: 700; color: #6b7789; margin-left: 2px; }
  .kpi .n { font-size: 10.5px; font-weight: 600; color: #7a8698; margin-top: 3px; }
  .trend { margin-top: 10px; background: var(--blue-deep); color: #fff; padding: 12px 15px; display: flex; align-items: center; gap: 12px; }
  .trend .l { font-size: 11.5px; font-weight: 800; opacity: .85; line-height: 1.5; }
  .trend .r { margin-left: auto; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 15px; font-weight: 800; white-space: nowrap; }
  .trend .r b { font-size: 22px; color: #8fd0ff; }

  .learn { margin-top: 12px; border: 1.5px solid var(--blue); }
  .learn .h { background: var(--blue); color: #fff; font-size: 12.5px; font-weight: 800; padding: 8px 16px; letter-spacing: .02em; }
  .learn .g { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
  .learn .g div { padding: 9px 16px 10px; border-right: 1px solid var(--line); }
  .learn .g div:last-child { border-right: none; }
  .learn .t { font-size: 13px; font-weight: 800; color: var(--blue-deep); }
  .learn .d { font-size: 11.4px; font-weight: 500; color: #4a5568; line-height: 1.6; margin-top: 3px; }


  /* ===== 表紙（白地・左に大見出し／右にイラスト） ===== */
  .cv { background: #fff; }
  .cv .t { position: absolute; left: 72px; top: 104px; font-size: 74px; font-weight: 900; color: var(--blue); line-height: 1.34; letter-spacing: .02em; }
  .cv .sub { position: absolute; left: 75px; top: 316px; font-size: 19px; font-weight: 800; color: #2a2f3a; letter-spacing: .05em; line-height: 1.7; }
  .cv .meta { position: absolute; left: 75px; top: 392px; font-size: 14px; font-weight: 700; color: #8a93a3; letter-spacing: .06em; }
  .cv .il { position: absolute; right: 44px; bottom: 74px; width: 560px; }
  .cv .logo { position: absolute; left: 72px; bottom: 58px; height: 38px; }

  /* ===== 目次 ===== */
  .ix { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px; margin-top: 30px; }
  .ix a, .ix div { display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid #d9e1ec; padding: 18px 20px; text-decoration: none; box-shadow: 0 4px 14px rgba(26,35,48,.05); }
  .ix .n { flex: 0 0 auto; width: 46px; height: 46px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .ix .b { flex: 1; min-width: 0; display: block; }
  .ix .nm { display: block; font-size: 19px; font-weight: 800; color: #1a2330; line-height: 1.35; }
  .ix .ds { display: block; font-size: 12px; font-weight: 600; color: #7a8698; margin-top: 4px; line-height: 1.5; }
  .ix .pg { flex: 0 0 auto; font-size: 12.5px; font-weight: 800; color: var(--blue); }
  .ix .soon { border-style: dashed; opacity: .62; }
  .ix .soon .n { background: #b9c4d4; }




  /* ===== 目次（この資料の中身） ===== */
  .ixh { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
  .ixh .lb { background: var(--blue); color: #fff; font-size: 13px; font-weight: 800; padding: 7px 16px; letter-spacing: .04em; white-space: nowrap; }
  .ixh .tx { font-size: 15px; font-weight: 700; color: #4a5568; }
  .ixh .pg { margin-left: auto; font-size: 13px; font-weight: 800; color: var(--blue); white-space: nowrap; }
  .ixg { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 26px; margin-top: 14px; }
  .ixg div { display: flex; align-items: center; gap: 13px; background: #fff; border: 1px solid var(--line); padding: 10px 14px; }
  .ixg .n { flex: 0 0 auto; width: 30px; height: 30px; background: var(--tint); color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; }
  .ixg .nm { font-size: 14.5px; font-weight: 800; color: #1a2330; }
  .ixg .ar { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 800; color: var(--blue); background: var(--tint); border: 1px solid #d5e3f4; padding: 3px 8px; margin-left: 8px; white-space: nowrap; }
  .ixg .pg { margin-left: auto; font-size: 12px; font-weight: 800; color: #8a93a3; white-space: nowrap; }

  /* ===== PDF出力 ===== */
  @page { size: 1280px 720px; margin: 0; }
  @media print {
    body { padding: 0; background: #fff; }
    * { box-shadow: none !important; }
    .note { display: none; }
    .deck { gap: 0; display: block; }
    .slide-shell { width: 1280px; }
    .slide-shell figcaption { display: none; }
    .slide-shell .clip { height: 720px; overflow: hidden; border-radius: 0; box-shadow: none; }
    .slide { transform: none; border: none; border-radius: 0; }
    figure.slide-shell { page-break-after: always; break-after: page; margin: 0; }
    figure.slide-shell:last-child { page-break-after: auto; }
  }

  /* ===== 表紙（ノウハウ形式） ===== */
  .blue-bg { background: linear-gradient(135deg, #1c3a6b 0%, var(--blue) 46%, #3a76c4 100%); color: #fff; }
  .waves { position: absolute; inset: 0; width: 100%; height: 100%; }
  .kcover .badge-row { position: absolute; top: 66px; left: 64px; display: flex; align-items: center; gap: 16px; }
  .kcover .badge { background: var(--amber); color: #4a3605; font-size: 16px; font-weight: 800; padding: 10px 18px; border-radius: 8px; }
  .kcover .badge-note { font-size: 20px; font-weight: 700; padding-bottom: 12px; border-bottom: 2px solid rgba(255,255,255,.85); letter-spacing: .04em; }
  .kcover .sub { position: absolute; left: 66px; top: 236px; font-size: 23px; font-weight: 700; letter-spacing: .04em; }
  .kcover .title { position: absolute; left: 62px; top: 288px; font-size: 68px; font-weight: 800; letter-spacing: .04em; line-height: 1.28; }
  .kcover .title small { display: block; margin-top: 10px; font-size: 34px; font-weight: 800; }
  .kcover .pills { position: absolute; right: 64px; top: 250px; display: grid; gap: 12px; }
  .kcover .pills span { border: 1.5px solid rgba(255,255,255,.75); border-radius: 999px; padding: 7px 22px; font-size: 14px; font-weight: 800; text-align: center; background: rgba(255,255,255,.08); }
  .kcover .date { position: absolute; left: 66px; top: 590px; font-size: 15px; font-weight: 600; letter-spacing: .18em; opacity: .8; }
  .kcover .logo { position: absolute; right: 64px; bottom: 48px; height: 44px; }
  /* ===== 縦方向をページいっぱいに使う ===== */
  .s-body.fl { display: flex; flex-direction: column; padding-bottom: 62px; }
  .s-body.fl > .grow { flex: 1 1 auto; min-height: 0; }
  .s-body.fl > .band { flex: 0 0 auto; }
  .cards.grow > div { display: flex; flex-direction: column; justify-content: flex-start; padding: 30px 28px; }
  .cards.grow .ic { width: 58px; height: 58px; } .cards.grow .ic svg { width: 28px; height: 28px; }
  .cards.grow .t { margin-top: 18px; font-size: 20px; } .cards.grow .d { margin-top: 12px; font-size: 14.5px; line-height: 1.95; }
  .cards.grow .g { align-self: flex-start; margin-top: auto; font-size: 12px; padding: 5px 14px; }
  .steps.grow { grid-auto-rows: 1fr; }
  .tpl.grow { grid-auto-rows: 1fr; }
  .chk.grow > div { display: flex; flex-direction: column; } .chk.grow .ci { flex: 1 1 0; display: flex; align-items: center; }
  .chk.grow .ci::before { top: 50%; transform: translateY(-50%); }
  .toc.grow { grid-auto-rows: 1fr; } .toc.grow > div { border-bottom: 1px solid var(--line); }
  table.grow { height: 100%; }
  .nts.grow { align-content: space-evenly; }
  /* ===== 事例ページ（メリハリ版） ===== */
  .vpt { margin-top: 10px; display: flex; align-items: center; gap: 14px; background: linear-gradient(90deg, #eaf2fc, #f6f9fd); border-left: 6px solid var(--blue-bright); padding: 9px 18px; }
  .vpt p { font-size: 18px; font-weight: 900; color: var(--blue-deep); letter-spacing: .02em; }
  .vpt .q { color: var(--blue-bright); display: flex; }
  .vpt.red { background: linear-gradient(90deg, #fdecea, #fef7f6); border-left-color: #d6453d; } .vpt.red p { color: #7a1f1a; } .vpt.red .q { color: #d6453d; }
  .vdt { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; margin-top: 10px; align-items: start; }
  .vdt + .learn { margin-top: 10px; }
  .vsec + .vsec { margin-top: 10px; }
  .vsec .vh { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 900; color: var(--blue-deep); padding-bottom: 6px; border-bottom: 2px solid var(--line); }
  .vsec .vi { width: 24px; height: 24px; border-radius: 50%; background: var(--blue-deep); color: #fff; display: flex; align-items: center; justify-content: center; }
  .vsec .vb { padding-top: 6px; }
  .vsec .vb .i { position: relative; padding: 3px 0 3px 16px; font-size: 12.8px; font-weight: 500; color: #3a4252; line-height: 1.55; }
  .vsec .vb .i::before { content: ""; position: absolute; left: 2px; top: 12px; width: 6px; height: 6px; background: var(--blue-bright); }
  .vsec .vb b, .vpt b { color: #1a2330; background: linear-gradient(transparent 58%, #ffe27a 58%); font-weight: 800; }
  .vsec.sm { margin-top: 8px; background: #f7f9fc; padding: 10px 12px; } .vsec.sm .vh { border-bottom-color: #e3e9f2; }
  .vk { background: #fff; border: 1.5px solid var(--line); padding: 8px 14px; margin-bottom: 8px; }
  .vk .k { font-size: 11.5px; font-weight: 800; color: var(--blue); }
  .vk .n { font-size: 10.5px; font-weight: 600; color: #7a8698; margin-top: 2px; }
  .vk.hero { background: var(--blue-deep); border: 0; color: #fff; padding: 14px 18px; }
  .vk.hero .k { color: #a9c8f0; } .vk.hero .n { color: #c3d3ea; }
  .vk.hero .v { font-size: 40px; font-weight: 900; line-height: 1.1; margin-top: 4px; } .vk.hero .v small { font-size: 16px; margin-left: 4px; }
  .vk.hero.red { background: #7a1f1a; }
  .vk.donut { display: flex; align-items: center; gap: 16px; } .vk.donut .k { font-size: 14px; }
  .vk .dn { position: relative; width: 92px; height: 92px; flex: 0 0 auto; }
  .vk .dn span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #1a2330; }
  .vk .dn small { font-size: 11px; }
  .vk.chart .br { display: grid; grid-template-columns: 26px 1fr 96px; align-items: center; gap: 8px; margin-top: 6px; }
  .vk.chart .bl { font-size: 11px; font-weight: 800; color: #7a8698; }
  .vk.chart .bt { height: 16px; background: #f0f3f8; display: block; } .vk.chart .bt span { display: block; height: 100%; }
  .vk.chart .bv { font-size: 14px; font-weight: 800; color: #5a6578; text-align: right; } .vk.chart .bv.hi { font-size: 18px; color: #1a2330; }
  .vk.chart .bv small { font-size: 10.5px; margin-left: 2px; }
  .vt { display: grid; gap: 8px; } .vt.c1 { grid-template-columns: 1fr; } .vt.c2 { grid-template-columns: 1fr 1fr; } .vt.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .vt > div { background: var(--tint); border-top: 3px solid var(--blue-bright); padding: 9px 12px; }
  .vt .k { font-size: 11px; font-weight: 800; color: var(--blue); }
  .vt .v { font-size: 22px; font-weight: 900; color: #1a2330; line-height: 1.2; margin-top: 2px; } .vt .v small { font-size: 11px; margin-left: 2px; color: #6b7789; }
  .vt .n { font-size: 10px; font-weight: 600; color: #7a8698; margin-top: 2px; }
  .learn .g > div { display: flex; gap: 10px; align-items: flex-start; padding-top: 7px; padding-bottom: 8px; }
  .learn .ln { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--amber); color: #4a3605; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .learn.red { border-color: #d6453d; } .learn.red .h { background: #d6453d; }
  /* 事例ページも縦をページいっぱいに使う（下に余白を残さない） */
  .s-body.fl > .dhd { flex: 0 0 auto; }
  .vdt.grow { align-items: stretch; margin-top: 12px; }
  .vdt.grow > .vl, .vdt.grow > .vr { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .vdt.grow > .vl { justify-content: space-between; }
  .vdt.grow .vsec + .vsec { margin-top: 0; }
  .vdt.grow .vsec { flex: 1 1 auto; display: flex; flex-direction: column; }
  .vdt.grow .vsec .vb { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-evenly; }
  .vdt.grow > .vr > * { flex: 1 1 auto; margin-bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .vdt.grow > .vr > .vk.donut { flex-direction: row; justify-content: flex-start; }
  .vdt.grow > .vr > .vt { display: grid; }
  .vdt.grow > .vr > .vt > div { display: flex; flex-direction: column; justify-content: center; }
  .vdt.grow > .vr > .vsec.sm { justify-content: flex-start; }

<script>
  // 事例ページ：補足の節（.vsec.sm）を、左右の列の高さが揃う方へ移す
  document.querySelectorAll(".vdt").forEach(function (d) {
    var l = d.querySelector(".vl"), r = d.querySelector(".vr"), sm = l.querySelectorAll(".vsec.sm");
    if (!sm.length) return;
    function need(c) { var n = 0; Array.prototype.forEach.call(c.children, function (e) { n += e.scrollHeight + 10; }); return n; }
    var sh = 0; sm.forEach(function (e) { sh += e.scrollHeight + 10; });
    d.classList.add("measure");
    var L = need(l), R = need(r);
    if (Math.max(L - sh, R + sh) < Math.max(L, R)) sm.forEach(function (e) { r.appendChild(e); });
    d.classList.remove("measure");
  });
  // 事例ページ：列に余裕があるときは本文を一段大きくする（下に余白を残さない）
  document.querySelectorAll(".vdt").forEach(function (d) {
    [d.querySelector(".vl"), d.querySelector(".vr")].forEach(function (col) {
      d.classList.add("measure"); var need = 0; Array.prototype.forEach.call(col.children, function (e) { need += e.scrollHeight; }); d.classList.remove("measure");
      if (col.clientHeight - need > 90) col.classList.add("roomy");
    });
  });
</script>
