<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* 自動生成: scripts/gen-course-decks から courses.json をもとに出力。手で直さず生成側を直すこと。
     設計は ebook-05（ChatGPT研修）で確定したもの。四角要素の角丸なし・円とピルのみ角丸。 */
  :root {
    --blue: #2c5c9c; --blue-deep: #1a2e50; --blue-bright: #1a6fb5; --blue-pale: #8fb0d8;
    --ink: #2a2f3a; --line: #e3e8ef; --amber: #f0b429; --tint: #eef4fb;
    --acc: #0e9f9f; --acc-deep: #076b6b; --acc-tint: #e6f6f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4f6f8; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; color: var(--ink); padding: 48px 0 96px; }
  .note { max-width: 1120px; margin: 0 auto 28px; font-size: 13px; font-weight: 700; color: #8a93a3; }
  .en { font-family: Montserrat, "Noto Sans JP", sans-serif; }

  .deck { display: flex; flex-direction: column; gap: 34px; align-items: center; counter-reset: pg -1; }
  .slide-shell { width: 1120px; counter-increment: pg; }
  .slide-shell figcaption { font-size: 12px; font-weight: 700; color: #8a93a3; margin: 8px 2px 0; letter-spacing: .04em; }
  .slide { width: 1280px; height: 720px; transform: scale(0.875); transform-origin: top left; background: #fff; position: relative; overflow: hidden; }
  .slide-shell .clip { height: 630px; overflow: hidden; border-radius: 0; box-shadow: 0 2px 10px rgba(26,35,48,.08); }

  /* ===== 共通 ===== */
  .s-body { position: absolute; inset: 0; padding: 44px 64px; z-index: 1; }
  .s-eyebrow { font-family: Montserrat, "Noto Sans JP", sans-serif; display: flex; align-items: center; gap: 9px; font-size: 15.5px; font-weight: 700; color: var(--blue-pale); letter-spacing: .02em; }
  .s-eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
  .s-title { font-size: 34px; font-weight: 800; color: #1a2330; letter-spacing: .02em; margin-top: 8px; line-height: 1.5; }
  .s-title b { color: var(--acc); }
  .s-title i { font-style: normal; color: var(--blue-bright); }
  .s-logo { position: absolute; top: 46px; right: 64px; height: 34px; }
  .s-lead { font-size: 16.5px; font-weight: 600; line-height: 1.85; color: #4a5568; margin-top: 10px; }
  .s-lead b { color: var(--acc); font-weight: 800; }
  .s-foot { position: absolute; left: 64px; bottom: 22px; font-size: 12.5px; color: #8a93a3; z-index: 5; }
  .s-num { position: absolute; right: 0; bottom: 0; width: 72px; height: 72px; background: var(--blue); border-radius: 72px 0 0 0; color: #fff; font-family: Montserrat, sans-serif; font-size: 14px; font-weight: 700; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 16px 11px 0; z-index: 5; }
  .s-num::before { content: counter(pg); }
  .blue-bg { background: linear-gradient(135deg, #1c3a6b 0%, var(--blue) 46%, #3a76c4 100%); color: #fff; }
  svg.waves { position: absolute; inset: 0; width: 100%; height: 100%; }
  .band { display: flex; align-items: center; gap: 11px; background: var(--acc-tint); border: 1.5px solid var(--acc); padding: 12px 20px; font-size: 14.5px; font-weight: 800; color: var(--acc-deep); }
  .band::before { content: "✓"; flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }

  /* ===== 表紙 ===== */
  .cover .badge-row { position: absolute; top: 62px; left: 64px; display: flex; align-items: center; gap: 16px; }
  .cover .badge { background: var(--amber); color: #4a3605; font-size: 16px; font-weight: 800; padding: 10px 18px; }
  .cover .badge-note { font-size: 20px; font-weight: 700; padding-bottom: 12px; border-bottom: 2px solid rgba(255,255,255,.85); letter-spacing: .04em; }
  .cover .sub { position: absolute; left: 66px; top: 228px; max-width: 620px; font-size: 21px; font-weight: 700; letter-spacing: .03em; line-height: 1.65; }
  .cover .title { position: absolute; left: 62px; top: 330px; max-width: 640px; font-weight: 800; letter-spacing: .03em; line-height: 1.2; }
  .cover .title small { display: block; font-size: 38px; letter-spacing: .08em; margin-top: 10px; font-weight: 700; }
  .cover .date { position: absolute; left: 66px; top: 600px; font-family: Montserrat, "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 600; letter-spacing: .18em; opacity: .8; }
  .cover .logo { position: absolute; right: 64px; bottom: 48px; height: 44px; }
  .cover .tool-logo { position: absolute; right: 70px; top: 318px; width: 470px; height: 190px; object-fit: contain; object-position: right center; }

  .cover .tool-logo.mono { filter: brightness(0) invert(1); }

  /* ===== 目次 ===== */
  .toc { margin-top: 26px; display: flex; flex-direction: column; gap: 11px; max-width: 830px; }
  .toc .row { display: flex; align-items: center; gap: 20px; font-size: 19px; font-weight: 800; color: #1a2330; background: #fff; border: 1px solid #d9e1ec; border-radius: 999px; padding: 10px 16px; box-shadow: 0 4px 14px rgba(26,35,48,.05); }
  .toc .no { font-family: Montserrat, sans-serif; flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }

  /* ===== 3カード（研修とは） ===== */
  .card3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-top: 22px; }
  .fc { background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(26,35,48,.06); overflow: hidden; display: flex; flex-direction: column; }
  .fc img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
  .fc .bd { padding: 14px 18px 16px; }
  .fc .no { font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 800; color: var(--acc); letter-spacing: .06em; }
  .fc .h { font-size: 17px; font-weight: 800; color: #1a2330; line-height: 1.45; margin-top: 3px; }
  .fc .d { font-size: 12.6px; font-weight: 500; color: #4a5568; line-height: 1.75; margin-top: 8px; }

  /* ===== 4カード（おすすめ） ===== */
  .card4 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; margin-top: 24px; }
  .rc { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--acc); box-shadow: 0 6px 20px rgba(26,35,48,.06); padding: 16px 20px; }
  .rc .h { display: flex; align-items: flex-start; gap: 10px; font-size: 17px; font-weight: 800; color: #1a2330; line-height: 1.5; }
  .rc .h::before { content: "✓"; flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px; }
  .rc .d { font-size: 13px; font-weight: 500; color: #4a5568; line-height: 1.75; margin-top: 7px; padding-left: 32px; }

  /* ===== スペック＋ステップ ===== */
  .spec4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
  .sp4 { background: var(--acc-tint); border: 1px solid rgba(0,0,0,.06); padding: 16px 14px; text-align: center; }
  .sp4 .k { font-size: 13px; font-weight: 800; color: var(--acc-deep); }
  .sp4 .v { font-size: 19px; font-weight: 800; color: #1a2330; margin-top: 5px; line-height: 1.3; }
  .sp4 .v b { font-family: Montserrat, "Noto Sans JP", sans-serif; font-size: 32px; font-weight: 800; color: var(--acc); padding: 0 2px; }
  .stepN { display: grid; align-items: stretch; margin-top: 22px; gap: 0; }
  .st { background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(26,35,48,.06); padding: 0 0 16px; }
  .st .hd { background: var(--blue); color: #fff; padding: 9px 12px; display: flex; align-items: center; gap: 9px; }
  .st .hd .n { font-family: Montserrat, sans-serif; font-size: 11.5px; font-weight: 800; border: 1.5px solid rgba(255,255,255,.75); padding: 3px 8px; white-space: nowrap; }
  .st .hd .t { font-size: 15.5px; font-weight: 800; }
  .st .li { font-size: 12.4px; font-weight: 700; color: #2a3446; padding: 8px 14px 0 26px; position: relative; line-height: 1.5; }
  .st .li::before { content: ""; position: absolute; left: 14px; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
  .st-arrow { display: flex; align-items: center; justify-content: center; }
  .st-arrow::before { content: ""; width: 13px; height: 22px; background: var(--blue-pale); clip-path: polygon(0 0, 52% 0, 100% 50%, 52% 100%, 0 100%, 46% 50%); }

  /* ===== カリキュラム ===== */
  .cur-hd { display: flex; align-items: center; gap: 16px; margin-top: 22px; }
  .cur-hd .n { font-family: Montserrat, sans-serif; background: var(--acc); color: #fff; font-size: 15px; font-weight: 800; padding: 8px 16px; letter-spacing: .06em; white-space: nowrap; }
  .cur-hd .t { font-size: 24px; font-weight: 800; color: #1a2330; }
  .cur-hd .prog { margin-left: auto; display: flex; align-items: center; gap: 7px; }
  .cur-hd .prog i { width: 36px; height: 7px; background: #e3eaf2; }
  .cur-hd .prog i.on { background: var(--acc); }
  .cur-hd .prog span { font-family: Montserrat, sans-serif; font-size: 12.5px; font-weight: 700; color: #8a93a3; margin-left: 5px; }
  .cur { display: grid; gap: 22px; margin-top: 20px; }
  .cur.c2 { grid-template-columns: 1fr 1fr; max-width: 820px; }
  .cur.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .cur.c4 { grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .cc { background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(26,35,48,.06); overflow: hidden; display: flex; flex-direction: column; }
  .cc img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-bottom: 1px solid var(--line); }
  .cc .bd { padding: 13px 16px 16px; flex: 1; }
  .cc .cat { display: inline-block; font-size: 11.5px; font-weight: 800; color: var(--acc-deep); background: var(--acc-tint); padding: 4px 10px; }
  .cc .h { font-size: 16px; font-weight: 800; color: #1a2330; line-height: 1.5; margin-top: 8px; }
  .cc .tg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cc .tg span { font-size: 10.8px; font-weight: 700; color: var(--blue); background: var(--tint); border-radius: 999px; padding: 3px 9px; }
  .cc .d { font-size: 12.2px; font-weight: 500; color: #4a5568; line-height: 1.7; margin-top: 9px; }
  .cur.c4 .cc .h { font-size: 15px; }
  .cur.c4 .cc .d { font-size: 11.6px; }

  /* ===== レッスン一覧 ===== */
  table.ls { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; }
  .ls th { background: var(--blue); color: #fff; font-size: 13.5px; font-weight: 800; padding: 10px 12px; text-align: left; }
  .ls th:nth-child(1), .ls th:nth-child(3), .ls th:nth-child(4) { text-align: center; }
  .ls td { font-size: 12.8px; font-weight: 500; color: #2a3446; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .ls tr:nth-child(even) td { background: #f7f9fc; }
  .ls td.no { font-family: Montserrat, sans-serif; text-align: center; font-weight: 800; color: var(--acc); width: 54px; }
  .ls td.ti { font-weight: 800; color: #1a2330; width: 320px; }
  .ls td.ch, .ls td.tm { text-align: center; font-family: Montserrat, "Noto Sans JP", sans-serif; font-weight: 700; width: 92px; }
  .ls td.bo { font-size: 11.8px; color: #4a5568; line-height: 1.55; }

  /* ===== 料金プラン ===== */
  .plan3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 22px; margin-top: 26px; }
  .pl { background: #fff; border: 1.5px solid var(--line); box-shadow: 0 6px 20px rgba(26,35,48,.06); }
  .pl.main { border-color: var(--acc); }
  .pl .hd { background: #f1f3f7; color: #1a2330; font-size: 19px; font-weight: 800; padding: 13px 18px; text-align: center; }
  .pl.main .hd { background: var(--acc); color: #fff; }
  .pl .bd { padding: 20px 20px 22px; text-align: center; }
  .pl .v { font-family: Montserrat, "Noto Sans JP", sans-serif; font-size: 33px; font-weight: 800; color: #1a2330; line-height: 1.1; }
  .pl .v small { font-family: "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 700; color: #6b7789; margin-left: 3px; }
  .pl .tax { font-size: 11.5px; font-weight: 600; color: #8a93a3; margin-top: 6px; }
  .pl .d { font-size: 13px; font-weight: 500; color: #4a5568; line-height: 1.8; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); text-align: left; }
  .pl .sub { display: inline-block; font-size: 11.5px; font-weight: 800; color: var(--acc-deep); background: var(--acc-tint); padding: 4px 12px; margin-top: 12px; }

  /* ===== 助成金 ===== */
  .sub2 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 26px; }
  .sb { border: 1.5px solid var(--acc); }
  .sb .hd { background: var(--acc); color: #fff; font-size: 18px; font-weight: 800; padding: 12px 18px; text-align: center; }
  .sb .bd { padding: 20px; display: grid; grid-template-columns: 1fr 30px 1fr; align-items: center; gap: 8px; }
  .sb .c { text-align: center; padding: 14px 8px; }
  .sb .c.g { background: #f1f3f7; }
  .sb .c.b { background: var(--acc-tint); border: 1.5px solid var(--acc); }
  .sb .k { font-size: 11.5px; font-weight: 800; color: #6b7789; }
  .sb .c.b .k { color: var(--acc-deep); }
  .sb .v { font-family: Montserrat, "Noto Sans JP", sans-serif; font-size: 27px; font-weight: 800; color: #1a2330; line-height: 1.15; margin-top: 3px; }
  .sb .v small { font-family: "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; color: #6b7789; }
  .sb .arr { font-family: Montserrat, sans-serif; font-size: 22px; font-weight: 800; color: var(--acc); text-align: center; }
  .sup5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 26px; }
  .sup5 div { background: var(--tint); padding: 14px 8px; text-align: center; font-size: 13.5px; font-weight: 800; color: var(--blue); line-height: 1.45; }

  /* ===== 流れ ===== */
  .flow { display: grid; grid-template-columns: 1fr 22px 1fr 22px 1fr 22px 1fr 22px 1fr; gap: 6px; margin-top: 30px; align-items: stretch; }
  .fs { background: #fff; border: 1px solid var(--line); padding: 18px 14px 16px; box-shadow: 0 6px 20px rgba(26,35,48,.06); text-align: center; position: relative; }
  .fs .n { font-family: Montserrat, sans-serif; width: 40px; height: 40px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; margin: 0 auto; }
  .fs .t { font-size: 16.5px; font-weight: 800; color: #1a2330; margin-top: 10px; line-height: 1.4; min-height: 46px; }
  .fs .d { font-size: 12.3px; font-weight: 500; color: #4a5568; line-height: 1.7; margin-top: 6px; text-align: left; }
  .fs .opt { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 800; background: var(--amber); color: #4a3605; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .farr { display: flex; align-items: center; justify-content: center; }
  .farr::before { content: ""; width: 14px; height: 24px; background: var(--blue-pale); clip-path: polygon(0 0, 52% 0, 100% 50%, 52% 100%, 0 100%, 46% 50%); }
  .cta { margin-top: 26px; padding: 26px 38px; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 30px; position: relative; overflow: hidden; background: linear-gradient(135deg, var(--acc-deep) 0%, var(--acc) 70%); }
  .cta .l .t { font-size: 20px; font-weight: 800; }
  .cta .l .d { font-size: 13.5px; font-weight: 500; opacity: .94; margin-top: 6px; }
  .cta .btn { flex: 0 0 auto; background: #fff; color: var(--acc-deep); border-radius: 999px; padding: 15px 30px; font-size: 16px; font-weight: 800; }

  /* ===== FAQ ===== */
  .faq { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
  .qa { background: #fff; border: 1px solid var(--line); padding: 14px 18px; box-shadow: 0 6px 20px rgba(26,35,48,.05); }
  .qa .q { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; font-weight: 800; color: #1a2330; line-height: 1.5; }
  .qa .q::before { content: "Q"; flex: 0 0 auto; font-family: Montserrat, sans-serif; width: 24px; height: 24px; border-radius: 50%; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; }
  .qa .a { display: flex; align-items: flex-start; gap: 10px; font-size: 12.6px; font-weight: 500; color: #4a5568; line-height: 1.75; margin-top: 7px; }
  .qa .a::before { content: "A"; flex: 0 0 auto; font-family: Montserrat, sans-serif; width: 24px; height: 24px; border-radius: 50%; background: var(--acc-tint); color: var(--acc-deep); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; }

  /* ===== 留意事項 ===== */
  .legal { margin-top: 36px; max-width: 1040px; }
  .legal .li { display: flex; gap: 12px; font-size: 14.5px; font-weight: 500; color: #4a5568; line-height: 1.9; padding: 14px 2px; border-bottom: 1px solid #eef1f5; }
  .legal .li::before { content: "※"; flex: 0 0 auto; color: var(--acc); font-weight: 800; }

  /* ===== PDF出力 ===== */
  @page { size: 1280px 720px; margin: 0; }
  @media print {
    body { padding: 0; background: #fff; }
    /* box-shadow はPDF化でラスタ画像になり、Preview等でカード間に灰色の帯として出るため無効化 */
    * { box-shadow: none !important; }
    .note { display: none; }
    .deck { gap: 0; display: block; }
    .slide-shell { width: 1280px; }
    .slide-shell figcaption { display: none; }
    .slide-shell .clip { height: 720px; overflow: hidden; border-radius: 0; box-shadow: none; }
    .slide { transform: none; border: none; border-radius: 0; }
    figure.slide-shell { page-break-after: always; break-after: page; margin: 0; }
    figure.slide-shell:last-child { page-break-after: auto; }
  }
</style>
</head>
