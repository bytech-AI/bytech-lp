<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 640px; height: 996px; background: transparent; }
  .bk { position: relative; width: 640px; height: 996px; background: #f9f5e6; border-radius: 18px; overflow: hidden; font-family: "Noto Sans JP", sans-serif; text-align: center; }
  .eb { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); background: #1b2e51; color: #fff; font-size: 15px; font-weight: 800; padding: 9px 26px; border-radius: 999px; white-space: nowrap; }
  .sub { position: absolute; top: 90px; left: 0; right: 0; font-size: 14px; font-weight: 700; color: #3a414a; }
  .ttl { position: absolute; top: 168px; left: 0; right: 0; font-size: 54px; font-weight: 900; color: #192f51; line-height: 1.22; letter-spacing: .01em; }
  .ttl small { display: block; margin-top: 10px; font-size: 44px; color: #2f6fd6; }
  .tools { position: absolute; top: 452px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; }
  .tools span { width: 66px; height: 66px; border-radius: 16px; background: #fff; box-shadow: 0 4px 14px rgba(27,46,81,.1); display: flex; align-items: center; justify-content: center; }
  .tools img { width: 42px; height: 42px; object-fit: contain; }
  .il { position: absolute; left: 50%; top: 404px; transform: translateX(-50%); width: 600px; }
  .ft { position: absolute; left: 0; right: 0; bottom: 0; height: 172px; background: #1b2e51; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .ft p { color: #fff; font-size: 28px; font-weight: 900; letter-spacing: .02em; }
  .ft div { display: flex; gap: 12px; }
  .ft span { border: 1.5px solid rgba(255,255,255,.7); color: #fff; font-size: 14px; font-weight: 800; padding: 6px 18px; border-radius: 999px; }
</style></head><body><div class="bk">
  <p class="eb">研修コース紹介</p>
  <p class="sub">管理職がAIを使いこなし、部下の育成まで進めたい組織・チーム向け</p>
  <p class="ttl">リーダー・マネージャー<br>向けAI研修<small>コース紹介資料</small></p>
  <img class="il" src="../../../public/biz/assets/img/index/plan/graphic/leader-manager.webp" alt="">
  <div class="ft"><p>全35レッスン・約5時間</p><div><span>オンライン</span><span>AIツール選択可</span></div></div>
</div></body></html>
