<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リノベる様 ご提案資料｜AI業務自動化研修 × リーダー・マネージャー向けAI研修</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* リノベる様向け個別提案書の「4ヶ月ロードマップ」パート。設計は proposal-bell-2610 と同系統
     （四角の角丸なし・円とピルのみ角丸）。
     ★受講者（営業・設計の部長）の担当範囲は、事前アンケート（91名）の所属部署から置いた仮説。
     ★KPIの項目は例示で、貴社の実数値は入れていない。 */
  :root {
    --blue: #2c5c9c; --blue-deep: #1a2e50; --blue-bright: #1a6fb5; --blue-pale: #8fb0d8;
    --ink: #2a2f3a; --line: #e3e8ef; --amber: #f0b429; --tint: #eef4fb;
    --teal: #13807a; --teal-deep: #0d4f4b; --teal-tint: #e8f5f3; --teal-pale: #8fcfc8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4f6f8; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; color: var(--ink); padding: 48px 0 96px; }
  .note { max-width: 1120px; margin: 0 auto 28px; font-size: 13px; font-weight: 700; color: #8a93a3; }
  .en { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; }

  .deck { display: flex; flex-direction: column; gap: 34px; align-items: center; counter-reset: pg; }
  .slide-shell { width: 1120px; counter-increment: pg; }
  .slide-shell figcaption { font-size: 12px; font-weight: 700; color: #8a93a3; margin: 8px 2px 0; letter-spacing: .04em; }
  .slide { width: 1280px; height: 720px; transform: scale(0.875); transform-origin: top left; background: #fff; position: relative; overflow: hidden; }
  .slide-shell .clip { height: 630px; overflow: hidden; border-radius: 0; box-shadow: 0 2px 10px rgba(26,35,48,.08); }

  /* ===== 共通 ===== */
  .s-body { position: absolute; inset: 0; padding: 36px 56px; z-index: 1; }
  .s-eyebrow { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; color: var(--blue-pale); letter-spacing: .02em; }
  .s-eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
  .s-logo { position: absolute; top: 38px; right: 56px; height: 30px; }
  .s-title { font-size: 28px; font-weight: 800; color: #1a2330; line-height: 1.4; letter-spacing: .01em; margin-top: 10px; }
  .s-title b { color: var(--blue-bright); }
  .s-lead { font-size: 14px; font-weight: 600; color: #4a5568; line-height: 1.7; margin-top: 8px; }
  .s-foot { position: absolute; left: 56px; right: 120px; bottom: 14px; font-size: 10px; color: #9aa3b2; line-height: 1.6; z-index: 5; }
  .s-num { position: absolute; right: 0; bottom: 0; width: 66px; height: 66px; background: var(--blue); border-radius: 66px 0 0 0; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 14px 10px 0; z-index: 5; }
  .s-num::before { content: counter(pg); }
  .pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 999px; letter-spacing: .04em; white-space: nowrap; }
  .pill.sales { background: var(--blue); color: #fff; }
  .pill.design { background: var(--teal); color: #fff; }

  /* ===== 01 扉 ===== */
  .cv { background: var(--blue-deep); color: #fff; }
  .cv::before { content: ""; position: absolute; right: 260px; top: -160px; width: 620px; height: 620px; border-radius: 50%; border: 90px solid rgba(143,208,255,.07); }
  .cv::after { content: ""; position: absolute; right: 140px; bottom: -220px; width: 420px; height: 420px; border-radius: 50%; background: rgba(143,208,255,.05); }
  .cv .eyebrow { position: absolute; left: 80px; top: 74px; display: inline-flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 800; color: #8fd0ff; letter-spacing: .14em; }
  .cv .eyebrow::before { content: ""; width: 30px; height: 3px; background: #8fd0ff; }
  .cv .to { position: absolute; left: 80px; top: 116px; font-size: 22px; font-weight: 800; letter-spacing: .04em; color: #dbe6f4; }
  .cv .to small { font-size: 14px; font-weight: 700; color: #9fb3cf; margin-left: 8px; }
  .cv .t { position: absolute; left: 78px; top: 176px; font-size: 54px; font-weight: 900; line-height: 1.34; letter-spacing: .02em; }
  .cv .t b { color: #8fd0ff; }
  .cv .goals { position: absolute; left: 80px; top: 352px; width: 700px; display: grid; gap: 12px; }
  .cv .goals .g { display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,.07); border-left: 4px solid #8fd0ff; padding: 16px 22px; }
  .cv .goals .g .n { flex: 0 0 auto; font-size: 12px; font-weight: 800; color: #8fd0ff; letter-spacing: .12em; }
  .cv .goals .g .v { font-size: 22px; font-weight: 800; line-height: 1.4; }
  .cv .who { position: absolute; left: 80px; top: 540px; display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 700; color: #b7c6dc; }
  .cv .who .pill.sales { background: #8fd0ff; color: var(--blue-deep); }
  .cv .who .pill.design { background: var(--teal-pale); color: var(--teal-deep); }
  .cv .logo { position: absolute; left: 80px; bottom: 52px; height: 34px; }
  .cv .side { position: absolute; right: 0; top: 0; bottom: 0; width: 430px; background: #fff; color: #1a2330; padding: 40px 44px 0; z-index: 2; }
  .cv .side .il { display: block; height: 238px; margin: 0 auto 14px; }
  .cv .months { display: grid; gap: 0; }
  .cv .months .m { display: flex; align-items: center; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .cv .months .m:first-child { border-top: 1px solid var(--line); }
  .cv .months .m .k { flex: 0 0 auto; width: 56px; font-size: 12.5px; font-weight: 800; color: #fff; background: var(--blue); text-align: center; padding: 4px 0; letter-spacing: .04em; }
  .cv .months .m:nth-child(2) .k { background: #24508c; } .cv .months .m:nth-child(3) .k { background: #1f4379; } .cv .months .m:nth-child(4) .k { background: var(--blue-deep); }
  .cv .months .m .v { font-size: 15.5px; font-weight: 800; line-height: 1.35; }
  .cv .months .m .v small { display: block; font-size: 11px; font-weight: 700; color: #8a93a3; margin-top: 1px; }
  .cv .months .end { margin-top: 14px; background: var(--blue-deep); color: #fff; padding: 12px 16px; font-size: 14px; font-weight: 800; line-height: 1.5; }

  /* ===== 02 受講者の想定 ===== */
  .who2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
  .who2 .col { border: 1px solid var(--line); }
  .who2 .col .h { display: flex; align-items: center; gap: 12px; padding: 14px 20px; color: #fff; }
  .who2 .col.sales .h { background: var(--blue); }
  .who2 .col.design .h { background: var(--teal); }
  .who2 .col .h .t { font-size: 19px; font-weight: 800; }
  .who2 .col .h .n { margin-left: auto; font-size: 13px; font-weight: 700; opacity: .9; }
  .who2 .col .h .n b { font-size: 24px; font-weight: 900; margin-right: 2px; }
  .who2 .col .b { padding: 14px 20px 16px; }
  .who2 .lb { font-size: 12px; font-weight: 800; color: #6b7789; letter-spacing: .06em; margin-bottom: 7px; }
  .who2 .deps { display: flex; flex-wrap: wrap; gap: 6px; }
  .who2 .deps span { font-size: 12px; font-weight: 700; color: #1a2330; background: #f2f5fa; padding: 4px 9px; }
  .who2 .deps span i { font-style: normal; color: #8a93a3; margin-left: 4px; font-weight: 700; }
  .who2 .col.design .deps span { background: var(--teal-tint); }
  .who2 .col.sales .deps span { background: var(--tint); }
  .lv { margin-top: 14px; }
  .lv .bar { display: flex; height: 26px; }
  .lv .bar div { display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; color: #fff; }
  .lv .leg { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; color: #8a93a3; margin-top: 5px; }
  .who2 .pains { margin-top: 14px; display: grid; gap: 5px; }
  .who2 .pains p { position: relative; font-size: 13px; font-weight: 600; color: #4a5568; line-height: 1.6; padding-left: 14px; }
  .who2 .pains p::before { content: ""; position: absolute; left: 0; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue-pale); }
  .who2 .col.design .pains p::before { background: var(--teal-pale); }
  .who2 .pains p b { color: #1a2330; font-weight: 800; }
  .who2 .role { margin-top: 14px; padding: 11px 14px; font-size: 13.5px; font-weight: 800; color: #1a2330; line-height: 1.6; }
  .who2 .col.sales .role { background: var(--tint); border-left: 4px solid var(--blue); }
  .who2 .col.design .role { background: var(--teal-tint); border-left: 4px solid var(--teal); }

  /* ===== 03 全体像 ===== */
  .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 20px; }
  .flow .m { position: relative; padding: 0 14px 0 0; }
  .flow .m .hd { position: relative; height: 54px; background: var(--blue); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 18px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%, 18px 50%); }
  .flow .m:first-child .hd { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); }
  .flow .m:nth-child(2) .hd { background: #24508c; }
  .flow .m:nth-child(3) .hd { background: #1f4379; }
  .flow .m:nth-child(4) .hd { background: var(--blue-deep); }
  .flow .m .hd .k { font-size: 12px; font-weight: 800; color: #8fd0ff; letter-spacing: .06em; padding-left: 12px; }
  .flow .m:first-child .hd .k { padding-left: 0; }
  .flow .m .hd .t { font-size: 16px; font-weight: 800; }
  .flow .m .bd { padding: 14px 4px 0 2px; }
  .flow .m .q { font-size: 15px; font-weight: 800; color: #1a2330; line-height: 1.5; min-height: 68px; }
  .flow .m .q b { color: var(--blue-bright); }
  .flow .m .lst { margin-top: 8px; display: grid; gap: 4px; }
  .flow .m .lst p { position: relative; font-size: 12.5px; font-weight: 600; color: #4a5568; line-height: 1.6; padding-left: 13px; }
  .flow .m .lst p::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--blue-pale); }
  .flow .m .out { margin-top: 12px; border: 1.5px solid var(--blue); background: var(--tint); padding: 9px 12px; }
  .flow .m .out .k { font-size: 10.5px; font-weight: 800; color: var(--blue); letter-spacing: .08em; }
  .flow .m .out .v { font-size: 13.5px; font-weight: 800; color: #1a2330; line-height: 1.5; margin-top: 2px; }
  .chain { display: flex; align-items: center; gap: 0; margin-top: 20px; border: 1px solid var(--line); }
  .chain .lb { flex: 0 0 auto; background: #f2f5fa; font-size: 12.5px; font-weight: 800; color: var(--blue-deep); padding: 0 18px; align-self: stretch; display: flex; align-items: center; }
  .chain .c { flex: 1; display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .chain .c + .c { border-left: 1px dashed var(--line); }
  .chain .c .n { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--tint); color: var(--blue); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .chain .c .t { font-size: 13.5px; font-weight: 800; color: #1a2330; }
  .chain .c .d { font-size: 11.5px; font-weight: 600; color: #6b7789; margin-top: 1px; line-height: 1.45; }

  /* ===== 04・05 部長別ロードマップ ===== */
  .rm { display: grid; grid-template-columns: 112px repeat(4, 1fr); gap: 0 8px; margin-top: 14px; }
  .rm .lb { display: flex; align-items: center; font-size: 12px; font-weight: 800; color: var(--blue-deep); background: #f2f5fa; padding: 0 12px; line-height: 1.45; border-bottom: 1px solid #fff; }
  .rm .hd { color: #fff; padding: 10px 14px 11px; }
  .rm .hd .k { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; opacity: .85; }
  .rm .hd .t { font-size: 15.5px; font-weight: 800; line-height: 1.35; margin-top: 2px; }
  .rm .cell { border-bottom: 1px solid var(--line); padding: 9px 4px 10px; }
  .rm .cell p { position: relative; font-size: 12px; font-weight: 600; color: #4a5568; line-height: 1.55; padding-left: 12px; }
  .rm .cell p + p { margin-top: 3px; }
  .rm .cell p::before { content: ""; position: absolute; left: 0; top: 7.5px; width: 5px; height: 5px; border-radius: 50%; background: var(--blue-pale); }
  .rm .cell p b { color: #1a2330; font-weight: 800; }
  .rm .cell.data p { font-size: 11.6px; color: #5a6578; }
  .rm .cell.data p::before { border-radius: 0; width: 6px; height: 2px; top: 9px; }
  .rm .cell.skill { background: #fafbfd; }
  .rm .cell.skill p { font-size: 12.4px; font-weight: 700; color: #1a2330; }
  .rm .cell.out { border-bottom: none; padding: 9px 0 0; }
  .rm .cell.out div { height: 100%; padding: 9px 12px; font-size: 12.8px; font-weight: 800; line-height: 1.5; }
  .rm.sales .hd { background: var(--blue); }
  .rm.sales .hd.m2 { background: #24508c; } .rm.sales .hd.m3 { background: #1f4379; } .rm.sales .hd.m4 { background: var(--blue-deep); }
  .rm.sales .cell.out div { background: var(--tint); border: 1.5px solid var(--blue); color: var(--blue-deep); }
  .rm.design .lb { color: var(--teal-deep); background: #eef6f5; }
  .rm.design .hd { background: var(--teal); }
  .rm.design .hd.m2 { background: #0f6f69; } .rm.design .hd.m3 { background: #0e5f5a; } .rm.design .hd.m4 { background: var(--teal-deep); }
  .rm.design .cell p::before { background: var(--teal-pale); }
  .rm.design .cell.out div { background: var(--teal-tint); border: 1.5px solid var(--teal); color: var(--teal-deep); }
  .rm-top { display: flex; align-items: center; gap: 12px; }
  .s-title.design b { color: var(--teal); }

  /* ===== 06 修了時の成果物 ===== */
  .tree2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
  .tree2 .col { border: 1px solid var(--line); padding: 14px 18px 16px; }
  .tree2 .col .top { display: flex; align-items: center; gap: 10px; }
  .tree2 .col .top .t { font-size: 15.5px; font-weight: 800; color: #1a2330; }
  .tree { display: grid; grid-template-columns: 150px 1fr; gap: 0; margin-top: 12px; }
  .tree .root { display: flex; flex-direction: column; justify-content: center; color: #fff; padding: 12px 14px; }
  .tree .root .k { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; opacity: .85; }
  .tree .root .v { font-size: 16px; font-weight: 900; line-height: 1.4; margin-top: 3px; }
  .tree .br { display: grid; gap: 6px; padding-left: 22px; position: relative; }
  .tree .br::before { content: ""; position: absolute; left: 10px; top: 16px; bottom: 16px; width: 2px; }
  .tree .br .lf { position: relative; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); padding: 7px 12px; }
  .tree .br .lf::before { content: ""; position: absolute; left: -12px; top: 50%; width: 12px; height: 2px; }
  .tree .br .lf .t { flex: 0 0 auto; font-size: 12.8px; font-weight: 800; color: #1a2330; }
  .tree .br .lf .d { font-size: 11.3px; font-weight: 600; color: #6b7789; line-height: 1.45; }
  .tree2 .sales .tree .root { background: var(--blue); }
  .tree2 .sales .tree .br::before, .tree2 .sales .tree .br .lf::before { background: var(--blue-pale); }
  .tree2 .design .tree .root { background: var(--teal); }
  .tree2 .design .tree .br::before, .tree2 .design .tree .br .lf::before { background: var(--teal-pale); }
  .tree2 .plan { margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); }
  .tree2 .plan div { padding: 8px 10px; font-size: 11.3px; font-weight: 600; color: #4a5568; line-height: 1.45; }
  .tree2 .plan div + div { border-left: 1px dashed var(--line); }
  .tree2 .plan div b { display: block; font-size: 12px; font-weight: 800; color: #1a2330; }
  .deliv { display: grid; grid-template-columns: auto repeat(4, 1fr); margin-top: 14px; background: var(--blue-deep); color: #fff; }
  .deliv .l { display: flex; align-items: center; font-size: 12.5px; font-weight: 800; letter-spacing: .08em; color: #8fd0ff; padding: 0 20px; border-right: 1px solid rgba(255,255,255,.16); }
  .deliv .c { padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .deliv .c + .c { border-left: 1px solid rgba(255,255,255,.12); }
  .deliv .c .n { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: #8fd0ff; color: var(--blue-deep); font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .deliv .c .t { font-size: 13.5px; font-weight: 800; line-height: 1.4; }

  /* ===== 縦幅いっぱいに配置（下に余白を残さない） ===== */
  .slide:not(.cv) .s-body { display: flex; flex-direction: column; padding-bottom: 46px; }
  .who2, .flow, .rm, .tree2 { flex: 1; min-height: 0; }
  .who2 { margin-top: 20px; }
  .who2 .col { display: flex; flex-direction: column; }
  .who2 .col .h { padding: 18px 22px; }
  .who2 .col .h .t { font-size: 21px; }
  .who2 .col .b { flex: 1; display: flex; flex-direction: column; padding: 18px 22px 20px; }
  .who2 .lb { font-size: 13px; margin-bottom: 9px; }
  .who2 .deps span { font-size: 13.5px; padding: 6px 11px; }
  .lv { margin-top: 22px; }
  .lv .bar { height: 34px; }
  .lv .bar div { font-size: 13px; }
  .lv .leg { font-size: 11.5px; margin-top: 7px; }
  .who2 .pains { margin-top: 22px; gap: 9px; }
  .who2 .pains p { font-size: 14.5px; line-height: 1.7; padding-left: 16px; }
  .who2 .pains p::before { top: 10px; }
  .tasks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tasks .tk { border: 1px solid var(--line); padding: 10px 8px 9px; text-align: center; }
  .tasks .tk img { display: block; height: 78px; max-width: 100%; object-fit: contain; margin: 0 auto; }
  .tasks .tk p { font-size: 12.3px; font-weight: 800; color: #1a2330; line-height: 1.45; margin-top: 7px; }
  .who2 .col.design .tasks .tk { border-color: #d5ebe8; }
  .who2 .role { margin-top: auto; padding: 16px 18px; font-size: 15px; }

  .flow { margin-top: 22px; }
  .flow .m { display: flex; flex-direction: column; }
  .flow .m .hd { height: 60px; flex: 0 0 auto; }
  .flow .m .hd .t { font-size: 17px; }
  .flow .m .bd { flex: 1; display: flex; flex-direction: column; padding-top: 18px; }
  .flow .m .mi { display: block; height: 128px; max-width: 100%; object-fit: contain; margin: 0 auto 12px; }
  .flow .m .bd { padding-top: 14px !important; }
  .flow .m .q { font-size: 16px; min-height: 50px; }
  .flow .m .lst { margin-top: 8px; gap: 5px; }
  .flow .m .lst p { font-size: 13.2px; line-height: 1.6; padding-left: 14px; }
  .flow .m .lst p::before { top: 9px; }
  .flow .m .out { margin-top: auto; padding: 10px 14px; }
  .flow .m .out .k { font-size: 11.5px; }
  .flow .m .out .v { font-size: 15px; }
  .flow .m .gain { margin-top: auto; padding: 10px 0 10px; border-top: 1px dashed var(--line); font-size: 13px; font-weight: 700; color: #1a2330; line-height: 1.55; }
  .flow .m .gain span { display: block; font-size: 11px; font-weight: 800; color: var(--blue); letter-spacing: .08em; margin-bottom: 2px; }
  .flow .m .gain + .out { margin-top: 0; }
  .chain { margin-top: 22px; }
  .chain .c { padding: 16px 18px; }
  .chain .c .t { font-size: 15px; }
  .chain .c .d { font-size: 12.5px; }

  .rm { grid-template-rows: auto 1.75fr 1fr 1fr auto; margin-top: 18px; }
  .rm .lb { font-size: 13.5px; }
  .rm .hd { padding: 12px 15px 13px; }
  .rm .hd .k { font-size: 12.5px; }
  .rm .hd .t { font-size: 17px; }
  .rm .cell { padding: 12px 4px 12px; display: flex; flex-direction: column; justify-content: center; }
  .rm .cell p { font-size: 13.6px; line-height: 1.6; padding-left: 13px; }
  .rm .cell p + p { margin-top: 6px; }
  .rm .cell p::before { top: 8.5px; }
  .rm .cell.data p { font-size: 13px; }
